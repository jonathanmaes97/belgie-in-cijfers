name: Data bijwerken en site publiceren

on:
  schedule:
    - cron: "23 5 * * *"   # elke dag om 05:23 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-en-publiceer
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Data ophalen en site opbouwen
        run: python -m pipeline.run

      - name: Bronnen verkennen (fase 0)
        continue-on-error: true
        run: python -m pipeline.probe_sources

      - name: Wijzigingen bewaren
        run: |
          git config user.name "belgie-in-cijfers bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site reports
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bijwerken
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
