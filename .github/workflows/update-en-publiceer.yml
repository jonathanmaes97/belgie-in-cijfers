name: Data bijwerken en site publiceren

on:
  schedule:
    - cron: "23 5 * * *"   # elke dag om 05:23 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-en-publiceer
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Data ophalen en site opbouwen
        run: python -m pipeline.run

      - name: Mail bij een mislukte bron (via een GitHub-issue)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.melding

      - name: Bronnen verkennen (enkel bij handmatig starten)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python -m pipeline.probe_sources
          python -m pipeline.probe_planbureau
          python -m pipeline.probe_nbb

      - name: Wijzigingen bewaren
        run: |
          git config user.name "belgie-in-cijfers bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site reports
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Preview-afbeeldingen voor LinkedIn en sociale media
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m pipeline.og

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mail als de hele update mislukt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bronfout --color D93F0B --force
          gh issue create --label bronfout --title "De dagelijkse update is mislukt" \
            --body "@jonathanmaes97 De dagelijkse update is volledig mislukt; de site toont de vorige versie. Bekijk de run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publiceren:
    needs: bijwerken
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
