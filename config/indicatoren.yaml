    definitie: {nl: "Aandeel van de auto in alle reizigerskilometers over land met auto, bus, autocar en trein (fiets en te voet tellen niet mee)."}
    uitleg: {nl: "Het gaat om afgelegde kilometers, niet om het aantal ritten. Fietsen en stappen zitten niet in deze Europese statistiek."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "reizigerskilometers over land worden met de auto afgelegd"}
    zoekwoorden: ["auto", "file", "modal split", "openbaar vervoer", "verkeer"]
    bron: {instelling: Eurostat, dataset: tran_hv_psmod, filters: {unit: PC, vehicle: CAR}}

  - id: trein_aandeel
    thema: mobiliteit
    titel: {nl: "Aandeel van de trein"}
    vraag: {nl: "Hoeveel van onze verplaatsingen doen we met de trein?"}
    definitie: {nl: "Aandeel van de trein in alle reizigerskilometers over land met auto, bus, autocar en trein."}
    uitleg: {nl: "Samen met het aandeel van de auto en van bus en autocar is dit honderd procent van de reizigerskilometers in deze statistiek."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    zoekwoorden: ["trein", "nmbs", "openbaar vervoer", "modal split", "spoor"]
    bron: {instelling: Eurostat, dataset: tran_hv_psmod, filters: {unit: PC, vehicle: TRN}}

  - id: autos_per_1000
    thema: mobiliteit
    titel: {nl: "Auto's per inwoner"}
    vraag: {nl: "Hoeveel personenauto's zijn er per 1.000 inwoners?"}
    definitie: {nl: "Aantal ingeschreven personenauto's per 1.000 inwoners."}
    uitleg: {nl: "Bedrijfswagens die op naam van een bedrijf staan, tellen ook mee."}
    eenheid: "per 1.000"
    decimalen: 0
    weergave: lijn
    zoekwoorden: ["auto", "wagenpark", "bedrijfswagens", "autobezit"]
    bron: {instelling: Eurostat, dataset: road_eqs_carhab, filters: {unit: NR}}

  # ---------- Veiligheid en justitie ----------
  - id: gevangenis_bezetting
    thema: veiligheid_justitie
    titel: {nl: "Bezetting van de gevangenissen"}
    vraag: {nl: "Hoe vol zitten de gevangenissen?"}
    definitie: {nl: "Aantal mensen in de gevangenis gedeeld door de officiële capaciteit, in procent. Boven honderd zitten er meer mensen dan er plaatsen zijn."}
    uitleg: {nl: "Overbevolking betekent meer mensen per cel, minder begeleiding en meer spanning voor gedetineerden en personeel. Het cijfer is een gemiddelde: sommige gevangenissen zitten veel voller dan andere."}
    eenheid: "%"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: ["gevangenis", "overbevolking", "detentie", "justitie", "gedetineerden"]
    afgeleid:
      formule: "gedetineerden * 100 / capaciteit"
      invoer: {gedetineerden: gevangenen_aantal, capaciteit: gevangenis_capaciteit}

  - id: gevangenen_per_100000
    thema: veiligheid_justitie
    titel: {nl: "Gedetineerden per inwoner"}
    vraag: {nl: "Hoeveel mensen zitten er in de gevangenis?"}
    definitie: {nl: "Aantal mensen in de gevangenis per 100.000 inwoners."}
    uitleg: {nl: "Dit omvat ook mensen in voorlopige hechtenis, die nog niet veroordeeld zijn."}
    eenheid: "per 100.000"
    decimalen: 0
    weergave: lijn
    zoekwoorden: ["gevangenen", "gedetineerden", "gevangenis", "straffen"]
    bron: {instelling: Eurostat, dataset: crim_pris_cap, filters: {indic_cr: PRIS_ACT_CAP, unit: P_HTHAB}}

  - id: gevangenen_aantal
    thema: veiligheid_justitie
    titel: {nl: "Aantal gedetineerden"}
    vraag: {nl: "Hoeveel mensen zitten er in de gevangenis?"}
    definitie: {nl: "Aantal mensen in de gevangenis."}
    eenheid: ""
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: crim_pris_cap, filters: {indic_cr: PRIS_ACT_CAP, unit: NR}}

  - id: gevangenis_capaciteit
    thema: veiligheid_justitie
    titel: {nl: "Capaciteit van de gevangenissen"}
    vraag: {nl: "Hoeveel plaatsen hebben de gevangenissen?"}
    definitie: {nl: "Officiële capaciteit van de gevangenissen, in aantal personen."}
    eenheid: ""
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: crim_pris_cap, filters: {indic_cr: PRIS_OFF_CAP, unit: NR}}

  # ---------- Bevolking ----------
  - id: bevolking
    thema: demografie
    titel: {nl: Inwoners}
    vraag: {nl: "Hoeveel mensen wonen er in België?"}
    definitie: {nl: Aantal inwoners op 1 januari.}
    uitleg: {nl: "Iedereen die officieel in België woont, ingeschreven in het Rijksregister."}
    eenheid: ""
    decimalen: 0
    weergave: kolommen
    landen: [BE]
    zoekwoorden: [inwoners, bevolking, mensen]
    bron: {instelling: Eurostat, dataset: tps00001, filters: {indic_de: JAN}}
    regionaal: {instelling: Eurostat, dataset: demo_r_d2jan, filters: {sex: T, age: TOTAL, unit: NR}, landen: [BE1, BE2, BE3]}

  - id: aandeel_65plus
    thema: demografie
    titel: {nl: 65-plussers}
    vraag: {nl: "Hoeveel inwoners zijn 65 jaar of ouder?"}
    definitie: {nl: Aandeel van de bevolking dat 65 jaar of ouder is.}
    uitleg: {nl: "Hoe groter dit aandeel, hoe meer er nodig is voor pensioenen en zorg, en hoe minder mensen op werkleeftijd er zijn om dat te betalen."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "inwoners is 65 jaar of ouder"}
    zoekwoorden: [ouderen, vergrijzing, pensioen, senioren]
    bron: {instelling: Eurostat, dataset: demo_pjanind, filters: {indic_de: PC_Y65_MAX}}
    regionaal: {instelling: Eurostat, dataset: demo_r_pjanind2, filters: {indic_de: PC_Y65_MAX, unit: PC}, landen: [BE1, BE2, BE3]}

  - id: netto_migratie
    thema: demografie
    titel: {nl: Netto migratie}
    vraag: {nl: "Hoeveel mensen komen er netto bij door migratie?"}
    definitie: {nl: "Aantal mensen dat naar het land verhuist min het aantal dat vertrekt, per 1.000 inwoners (inclusief statistische correctie)."}
    uitleg: {nl: "Het gaat om iedereen die verhuist, ook Belgen die naar het buitenland vertrekken of terugkeren. Een positief cijfer betekent dat er meer mensen komen wonen dan er vertrekken."}
    eenheid: " per 1.000"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [migratie, immigratie, emigratie, migranten, verhuizen, inwijking]
    bron: {instelling: Eurostat, dataset: demo_gind, filters: {indic_de: CNMIGRATRT}}

  - id: natuurlijke_aangroei
    thema: demografie
    titel: {nl: Natuurlijke aangroei}
    vraag: {nl: "Worden er meer mensen geboren dan er sterven?"}
    definitie: {nl: "Aantal geboorten min het aantal overlijdens, per 1.000 inwoners."}
    uitleg: {nl: "Samen met de netto migratie bepaalt dit of de bevolking groeit. Een negatief cijfer betekent dat er meer mensen sterven dan er geboren worden."}
    eenheid: " per 1.000"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [geboorten, overlijdens, sterfte, baby's, aangroei]
    bron: {instelling: Eurostat, dataset: demo_gind, filters: {indic_de: NATGROWRT}}

  - id: geboren_buitenland
    thema: demografie
    titel: {nl: Geboren in het buitenland}
    vraag: {nl: "Hoeveel inwoners zijn in het buitenland geboren?"}
    definitie: {nl: "Aandeel van de inwoners dat buiten het land geboren is, ongeacht hun nationaliteit."}
    uitleg: {nl: "Het geboorteland zegt niets over de nationaliteit: ook Belgen die in het buitenland geboren zijn, tellen mee, en kinderen van migranten die hier geboren zijn niet."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "inwoners is in het buitenland geboren"}
    zoekwoorden: [migratie, migranten, buitenland, herkomst, nieuwkomers]
    afgeleid:
      formule: "buitenland * 100 / totaal"
      invoer: {buitenland: bevolking_buitenland_geboren, totaal: bevolking_naar_geboorteland}

  - id: bevolking_buitenland_geboren
    thema: demografie
    titel: {nl: Inwoners geboren in het buitenland}
    vraag: {nl: "Hoeveel inwoners zijn in het buitenland geboren (aantal)?"}
    definitie: {nl: "Aantal inwoners op 1 januari dat buiten het land geboren is."}
    eenheid: ""
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: migr_pop3ctb, filters: {c_birth: FOR, age: TOTAL, sex: T, unit: NR}}

  - id: bevolking_naar_geboorteland
    thema: demografie
    titel: {nl: Inwoners (naar geboorteland)}
    vraag: {nl: "Hoeveel inwoners telt de reeks naar geboorteland?"}
    definitie: {nl: "Totaal aantal inwoners op 1 januari in dezelfde reeks naar geboorteland."}
    eenheid: ""
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: migr_pop3ctb, filters: {c_birth: TOTAL, age: TOTAL, sex: T, unit: NR}}

  - id: asielaanvragen
    thema: demografie
    titel: {nl: Eerste asielaanvragen}
    vraag: {nl: "Hoeveel mensen vragen voor het eerst asiel aan?"}
    definitie: {nl: "Aantal personen dat in dat jaar voor het eerst een verzoek om internationale bescherming indient."}
    uitleg: {nl: "Een asielaanvraag is nog geen erkenning: een deel van de aanvragen wordt geweigerd. Alleen eerste aanvragen tellen hier mee, geen herhaalde."}
    eenheid: ""
    decimalen: 0
    weergave: kolommen
    landen: [BE]
    zoekwoorden: [asiel, vluchtelingen, asielzoekers, opvang, bescherming]
    bron: {instelling: Eurostat, dataset: migr_asyappctza, filters: {citizen: TOTAL, sex: T, age: TOTAL, applicant: FRST, unit: PER}}
