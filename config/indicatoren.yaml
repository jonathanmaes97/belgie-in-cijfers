# Catalogus van alle thema's en indicatoren op de site.
#
# Elke indicator heeft precies één primaire bron. Elk getal op de site komt
# uit deze bron via code; niets wordt met de hand of door een taalmodel ingevuld.
# Teksten hieronder bevatten bewust GEEN cijfers: die komen altijd uit de data.
#
# Velden per indicator:
#   id, thema         sleutels
#   titel             korte naam
#   vraag             de vraag die het cijfer beantwoordt, in gewone taal
#   definitie         technische definitie in één zin
#   uitleg            wat het betekent voor een gewone burger (zonder cijfers)
#   eenheid, decimalen
#   weergave          lijn | kolommen (verloop per jaar), en optioneel
#   beeld             wafel (x op 100) | doel (voortgangsbalk naar de norm)
#   wafel_tekst       zin na "x op de 100 ..." bij beeld: wafel
#   zoekwoorden       extra woorden voor de zoekfunctie
#   bron | afgeleid   waar het getal vandaan komt
#   norm, regionaal, landen, verborgen   optioneel

standaard_landen: [BE, EU27_2020, NL, DE, FR, LU]
vanaf_jaar: 2005

landnamen:
  BE: {nl: België}
  EU27_2020: {nl: EU-gemiddelde}
  NL: {nl: Nederland}
  DE: {nl: Duitsland}
  FR: {nl: Frankrijk}
  LU: {nl: Luxemburg}
  BE1: {nl: Brussel}
  BE2: {nl: Vlaanderen}
  BE3: {nl: Wallonië}

themas:
  - id: economie
    nl: Economie
    icoon: economie
    vraag: Groeit onze economie?
    kop: bbp_groei
    intro: >-
      De economie is alles wat we samen produceren en verdienen. Groeit ze, dan is er meestal meer werk
      en meer geld voor lonen en overheidsdiensten. Hier zie je hoe snel de Belgische economie groeit,
      hoeveel we per persoon produceren en hoe snel de prijzen stijgen.
    bevoegd: >-
      De Europese Centrale Bank bepaalt de rente in de eurozone. Economisch beleid wordt in België
      verdeeld tussen de federale overheid (bijvoorbeeld belastingen) en de gewesten (bijvoorbeeld
      steun aan bedrijven en investeringen).
    begrippen: [bbp, reeel, inflatie]

  - id: overheidsfinancien
    nl: Overheidsfinanciën
    icoon: overheid
    vraag: Hoe staat het met de staatskas?
    kop: schuld_per_inwoner
    intro: >-
      De overheid int belastingen en sociale bijdragen en geeft dat geld uit aan onder meer pensioenen,
      zorg, onderwijs en wegen. Geeft ze meer uit dan ze ontvangt, dan is er een tekort en stijgt de schuld.
      Op die schuld betaalt de overheid rente.
    bevoegd: >-
      Elke overheid heeft een eigen begroting: de federale overheid, de gemeenschappen, de gewesten en de
      lokale besturen. De cijfers hier tellen ze allemaal samen, zoals Europa dat voorschrijft.
    begrippen: [bbp, procent_bbp, voorlopig]

  - id: werk
    nl: Werk
    icoon: werk
    vraag: Hoeveel mensen werken er?
    kop: werkzaamheidsgraad
    intro: >-
      Hoeveel mensen een job hebben, bepaalt mee hoeveel belastingen en bijdragen er binnenkomen om onder
      meer pensioenen en zorg te betalen. Hier zie je hoeveel volwassenen werken en hoeveel mensen werk zoeken,
      ook per gewest.
    bevoegd: >-
      Arbeidsrecht en werkloosheidsuitkeringen zijn federaal. Werkzoekenden begeleiden is een taak van de
      gewesten en de Duitstalige Gemeenschap (VDAB, Le Forem, Actiris en ADG).
    begrippen: [werkzaamheidsgraad, werkloosheidsgraad]

  - id: gezondheid
    nl: Gezondheid
    icoon: gezondheid
    vraag: Hoe gezond zijn we?
    kop: levensverwachting
    intro: >-
      Hoe lang en hoe gezond we leven, hangt af van veel dingen: zorg, levensstijl, werk en inkomen.
      Hier zie je hoe lang mensen gemiddeld leven en hoeveel we samen aan gezondheidszorg uitgeven.
    bevoegd: >-
      De ziekteverzekering en de financiering van ziekenhuizen zijn grotendeels federaal. Preventie,
      ouderenzorg en de eerstelijnszorg zijn vooral een zaak van de gemeenschappen.
    begrippen: [bbp, procent_bbp]

  - id: onderwijs
    nl: Onderwijs
    icoon: onderwijs
    vraag: Hoe hoog geschoold zijn we?
    kop: diploma_hoger_onderwijs
    intro: >-
      Een diploma vergroot de kans op werk en een goed inkomen. Hier zie je hoeveel jongeren zonder diploma
      de school verlaten en hoeveel jonge volwassenen een diploma hoger onderwijs hebben.
    bevoegd: >-
      Onderwijs is in België een bevoegdheid van de gemeenschappen: de Vlaamse, de Franse en de Duitstalige
      Gemeenschap hebben elk hun eigen onderwijs.
    begrippen: [hoger_onderwijs]

  - id: wonen_armoede
    nl: Wonen en armoede
    icoon: wonen
    vraag: Kan iedereen rondkomen?
    kop: armoede_uitsluiting
    intro: >-
      Een betaalbare woning en genoeg inkomen om rond te komen zijn basisbehoeften. Hier zie je hoeveel
      mensen risico lopen op armoede of sociale uitsluiting en hoe snel de woningprijzen stijgen.
    bevoegd: >-
      Woonbeleid, zoals sociale huisvesting en huurregels, is een bevoegdheid van de gewesten. Uitkeringen
      en pensioenen zijn federaal; de OCMW's helpen mensen lokaal.
    begrippen: [arope]

  - id: klimaat_energie
    nl: Klimaat en energie
    icoon: klimaat
    vraag: Hoe groen is onze energie?
    kop: hernieuwbare_energie
    intro: >-
      Broeikasgassen warmen de aarde op. Europa wil dat de uitstoot daalt en dat meer energie uit zon, wind
      en andere hernieuwbare bronnen komt. Hier zie je hoe België het doet: hoeveel we uitstoten, hoeveel
      energie hernieuwbaar is en welk deel van onze elektriciteit uit kerncentrales komt.
    bevoegd: >-
      Bevoegdheden zijn verdeeld: de federale overheid is onder meer bevoegd voor windmolens op zee en
      kernenergie, de gewesten voor hernieuwbare energie op land en energiebesparing.
    begrippen: [co2_equivalent, gwh]

  - id: mobiliteit
    nl: Mobiliteit
    icoon: mobiliteit
    vraag: Komen we vlot en veilig aan?
    kop: treinstiptheid
    intro: >-
      Hoe we ons verplaatsen, bepaalt hoeveel tijd we onderweg zijn en hoe veilig dat is. Hier zie je hoe
      stipt de treinen rijden en hoeveel mensen er sterven in het verkeer.
    bevoegd: >-
      Het spoor (NMBS en Infrabel) is federaal. Wegen, verkeersveiligheid op gewestwegen en bus en tram
      (De Lijn, TEC en MIVB) zijn bevoegdheden van de gewesten.
    begrippen: [stiptheid]

  - id: demografie
    nl: Bevolking
    icoon: bevolking
    vraag: Hoeveel zijn we, en hoe oud?
    kop: bevolking
    intro: >-
      Hoeveel mensen er in België wonen en hoe oud ze zijn, bepaalt hoeveel scholen, woningen, zorg en
      pensioenen er nodig zijn.
    bevoegd: >-
      Bevolkingscijfers komen uit het Rijksregister. Migratiebeleid is federaal; inburgering is een zaak
      van de gemeenschappen.
    begrippen: [vergrijzing]

begrippen:
  bbp: {term: Bbp, uitleg: "Het bruto binnenlands product: de waarde van alles wat in een land in een jaar wordt geproduceerd. Het is de gangbare maat voor de grootte van een economie."}
  reeel: {term: Reële groei, uitleg: "Groei waarbij het effect van prijsstijgingen eruit gehaald is. Zo zie je of we echt meer produceren, niet alleen duurder."}
  inflatie: {term: Inflatie, uitleg: "Hoeveel de prijzen van wat gezinnen kopen gemiddeld stijgen in een jaar."}
  procent_bbp: {term: In procent van het bbp, uitleg: "Een bedrag vergeleken met de grootte van de economie. Zo kun je landen van verschillende grootte eerlijk vergelijken."}
  voorlopig: {term: Voorlopig, uitleg: "Een eerste cijfer dat de bron later nog kan bijstellen. Wij tonen altijd de recentste versie en houden herzieningen bij."}
  werkzaamheidsgraad: {term: Werkzaamheidsgraad, uitleg: "Het aandeel van de mensen tussen 20 en 64 jaar dat werkt. Ook wie deeltijds werkt, telt mee."}
  werkloosheidsgraad: {term: Werkloosheidsgraad, uitleg: "Het aandeel werklozen onder de mensen die werken of actief werk zoeken. Wie niet zoekt, bijvoorbeeld studenten, telt niet mee."}
  hoger_onderwijs: {term: Hoger onderwijs, uitleg: "Een bachelor- of masterdiploma, of een gelijkwaardige opleiding na het secundair onderwijs."}
  arope: {term: Armoede of sociale uitsluiting, uitleg: "Wie een laag inkomen heeft, zich basisdingen niet kan veroorloven (zoals de verwarming aanzetten), of in een gezin woont waar bijna niemand werkt."}
  co2_equivalent: {term: CO₂-equivalent, uitleg: "Alle broeikasgassen omgerekend naar de hoeveelheid CO₂ die evenveel opwarming veroorzaakt."}
  gwh: {term: Gigawattuur (GWh), uitleg: "Een maat voor een hoeveelheid elektriciteit: één miljoen kilowattuur."}
  stiptheid: {term: Stiptheid, uitleg: "Een trein is stipt als hij minder dan 6 minuten te laat op zijn eindbestemming aankomt. Afgeschafte treinen tellen in dit cijfer niet mee."}
  vergrijzing: {term: Vergrijzing, uitleg: "Het aandeel ouderen in de bevolking neemt toe, omdat we langer leven en er minder kinderen geboren worden."}

indicatoren:
  # ---------- Economie ----------
  - id: bbp_groei
    thema: economie
    titel: {nl: Economische groei}
    vraag: {nl: "Hoeveel groeit de economie per jaar?"}
    definitie: {nl: Jaarlijkse groei van het bruto binnenlands product, na correctie voor inflatie.}
    uitleg: {nl: "Een positief cijfer betekent dat we samen meer produceerden dan het jaar ervoor. Een negatief cijfer, zoals in het coronajaar 2020, betekent een krimp."}
    eenheid: "%"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [groei, recessie, economie, bbp]
    bron: {instelling: Eurostat, dataset: tec00115, filters: {unit: CLV_PCH_PRE, na_item: B1GQ}}

  - id: bbp_per_inwoner
    thema: economie
    titel: {nl: Bbp per inwoner}
    vraag: {nl: "Hoeveel produceren we per persoon?"}
    definitie: {nl: Bruto binnenlands product gedeeld door het aantal inwoners, in lopende prijzen.}
    uitleg: {nl: "Een maat voor de welvaart van een land. Het is geen inkomen dat iedereen krijgt, maar de totale productie gedeeld door het aantal inwoners."}
    eenheid: " €"
    decimalen: 0
    weergave: lijn
    zoekwoorden: [welvaart, rijkdom, inkomen]
    bron: {instelling: Eurostat, dataset: nama_10_pc, filters: {unit: CP_EUR_HAB, na_item: B1GQ}}
    regionaal: {instelling: Eurostat, dataset: nama_10r_2gdp, filters: {unit: EUR_HAB}, landen: [BE1, BE2, BE3]}

  - id: inflatie
    thema: economie
    titel: {nl: Inflatie}
    vraag: {nl: "Hoeveel duurder wordt het leven?"}
    definitie: {nl: Jaarlijkse gemiddelde stijging van de consumptieprijzen (geharmoniseerde index, HICP).}
    uitleg: {nl: "Bij een inflatie van 3% kost wat vorig jaar 100 euro kostte, nu gemiddeld 103 euro. In België stijgen veel lonen en uitkeringen automatisch mee (de indexering)."}
    eenheid: "%"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [prijzen, index, indexering, duurte, koopkracht]
    bron: {instelling: Eurostat, dataset: prc_hicp_aind, filters: {unit: RCH_A_AVG, coicop: CP00}}

  # ---------- Overheidsfinanciën ----------
  - id: schuld_per_inwoner
    thema: overheidsfinancien
    titel: {nl: Schuld per inwoner}
    vraag: {nl: "Hoeveel schuld heeft de overheid per inwoner?"}
    definitie: {nl: Overheidsschuld gedeeld door het aantal inwoners op 1 januari van hetzelfde jaar.}
    uitleg: {nl: "Dit is geen bedrag dat je zelf moet betalen. Het toont hoe groot de totale overheidsschuld is als je die over alle inwoners zou verdelen."}
    eenheid: " €"
    decimalen: 0
    weergave: kolommen
    zoekwoorden: [staatsschuld, schuld, lening]
    afgeleid:
      formule: "schuld * 1000000 / inwoners"
      invoer: {schuld: overheidsschuld_eur, inwoners: bevolking}

  - id: overheidsschuld
    thema: overheidsfinancien
    titel: {nl: Overheidsschuld}
    vraag: {nl: "Hoe groot is de staatsschuld vergeleken met de economie?"}
    definitie: {nl: Geconsolideerde brutoschuld van alle overheden samen, in procent van het bbp.}
    uitleg: {nl: "Bij 100% is de schuld even groot als alles wat het land in één jaar produceert. Europese regels vragen een schuld van maximaal 60%."}
    eenheid: "% bbp"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [staatsschuld, schuldgraad, maastricht]
    bron: {instelling: Eurostat, dataset: gov_10dd_edpt1, filters: {unit: PC_GDP, sector: S13, na_item: GD}}
    norm: {waarde: 60, label: {nl: Europese norm 60%}, bron: Verdrag betreffende de werking van de EU, protocol 12}

  - id: begrotingssaldo
    thema: overheidsfinancien
    titel: {nl: Begrotingssaldo}
    vraag: {nl: "Geeft de overheid meer uit dan ze ontvangt?"}
    definitie: {nl: Overschot (+) of tekort (−) van alle overheden samen, in procent van het bbp.}
    uitleg: {nl: "Een negatief cijfer is een tekort: de overheid gaf meer uit dan ze ontving en moest lenen. Europese regels vragen een tekort van maximaal 3%."}
    eenheid: "% bbp"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [tekort, begroting, deficit, overschot]
    bron: {instelling: Eurostat, dataset: gov_10dd_edpt1, filters: {unit: PC_GDP, sector: S13, na_item: B9}}
    norm: {waarde: -3, label: {nl: Europese norm −3%}, bron: Verdrag betreffende de werking van de EU, protocol 12}

  - id: rente_per_dag
    thema: overheidsfinancien
    titel: {nl: Rente per dag}
    vraag: {nl: "Hoeveel rente betaalt de overheid per dag?"}
    definitie: {nl: Jaarlijkse rentelasten van de overheid gedeeld door 365, in miljoen euro.}
    uitleg: {nl: "Rente is de prijs die de overheid betaalt om geld te lenen. Dat geld kan niet naar andere uitgaven gaan."}
    eenheid: " mln €"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [rente, intrest, rentelasten]
    afgeleid:
      formule: "rente / 365"
      invoer: {rente: rentelasten_eur}

  - id: rentelasten
    thema: overheidsfinancien
    titel: {nl: Rentelasten}
    vraag: {nl: "Hoeveel rente betalen we vergeleken met de economie?"}
    definitie: {nl: Rente die de overheid betaalt op haar schuld, in procent van het bbp.}
    uitleg: {nl: "Zo kun je de rentelast van landen van verschillende grootte vergelijken."}
    eenheid: "% bbp"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [rente, intrest]
    bron: {instelling: Eurostat, dataset: gov_10a_main, filters: {unit: PC_GDP, sector: S13, na_item: D41PAY}}

  - id: belastingdruk
    thema: overheidsfinancien
    titel: {nl: Belastingdruk}
    vraag: {nl: "Hoeveel belastingen en bijdragen betalen we samen?"}
    definitie: {nl: Alle belastingen en sociale bijdragen samen, in procent van het bbp.}
    uitleg: {nl: "Alle belastingen (op inkomen, consumptie, vermogen) en sociale bijdragen samen, vergeleken met de grootte van de economie. Het zegt niets over wat één persoon betaalt."}
    eenheid: "% bbp"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [belastingen, taksen, fiscaliteit, rsz]
    bron: {instelling: Eurostat, dataset: gov_10a_taxag, filters: {unit: PC_GDP, sector: S13_S212, na_item: D2_D5_D91_D61_M_D995}}

  - id: overheidsschuld_eur
    thema: overheidsfinancien
    titel: {nl: Overheidsschuld in euro}
    vraag: {nl: "Hoeveel schuld heeft de overheid in euro?"}
    definitie: {nl: Geconsolideerde brutoschuld van alle overheden samen, in miljoen euro.}
    eenheid: " mln €"
    decimalen: 0
    landen: [BE]
    verborgen: true   # alleen gebruikt voor berekeningen
    bron: {instelling: Eurostat, dataset: gov_10dd_edpt1, filters: {unit: MIO_EUR, sector: S13, na_item: GD}}

  - id: rentelasten_eur
    thema: overheidsfinancien
    titel: {nl: Rentelasten in euro}
    vraag: {nl: "Hoeveel rente betaalt de overheid in euro?"}
    definitie: {nl: Rente die de overheid betaalt op haar schuld, in miljoen euro.}
    eenheid: " mln €"
    decimalen: 0
    landen: [BE]
    verborgen: true
    bron: {instelling: Eurostat, dataset: gov_10a_main, filters: {unit: MIO_EUR, sector: S13, na_item: D41PAY}}

  # ---------- Werk ----------
  - id: werkzaamheidsgraad
    thema: werk
    titel: {nl: Werkzaamheidsgraad}
    vraag: {nl: "Hoeveel volwassenen hebben een job?"}
    definitie: {nl: Aandeel van de 20- tot 64-jarigen dat een job heeft.}
    uitleg: {nl: "Studenten, gepensioneerden onder 65, langdurig zieken en werkzoekenden werken niet en verlagen dit cijfer. België wil tegen 2030 naar 80%."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: doel
    zoekwoorden: [jobs, werkgelegenheid, tewerkstelling, 80 procent]
    bron: {instelling: Eurostat, dataset: lfsi_emp_a, filters: {indic_em: EMP_LFS, sex: T, age: Y20-64, unit: PC_POP}}
    norm: {waarde: 80, label: {nl: Belgisch doel voor 2030 80%}, bron: Nationaal doel België in het kader van de Europese pijler van sociale rechten}
    regionaal: {instelling: Eurostat, dataset: lfst_r_lfe2emprt, filters: {sex: T, age: Y20-64, unit: PC}, landen: [BE1, BE2, BE3]}

  - id: werkloosheid
    thema: werk
    titel: {nl: Werkloosheid}
    vraag: {nl: "Hoeveel mensen zoeken werk?"}
    definitie: {nl: Aandeel werklozen in de beroepsbevolking van 15 tot 74 jaar (internationale definitie).}
    uitleg: {nl: "Volgens de internationale definitie: wie geen werk heeft, actief zoekt en snel kan beginnen. Dat is niet hetzelfde als het aantal mensen met een werkloosheidsuitkering."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [werklozen, werkzoekenden, vdab, forem, actiris]
    bron: {instelling: Eurostat, dataset: une_rt_a, filters: {age: Y15-74, unit: PC_ACT, sex: T}}
    regionaal: {instelling: Eurostat, dataset: lfst_r_lfu3rt, filters: {sex: T, age: Y15-74, unit: PC, isced11: TOTAL}, landen: [BE1, BE2, BE3]}

  # ---------- Gezondheid ----------
  - id: levensverwachting
    thema: gezondheid
    titel: {nl: Levensverwachting}
    vraag: {nl: "Hoe oud worden we gemiddeld?"}
    definitie: {nl: Gemiddeld aantal jaren dat een pasgeborene zal leven bij de sterftecijfers van dat jaar.}
    uitleg: {nl: "Hoe lang een baby die dit jaar geboren wordt gemiddeld zal leven, als de gezondheid van de bevolking blijft zoals nu."}
    eenheid: " jaar"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [leeftijd, sterfte, gezondheid]
    bron: {instelling: Eurostat, dataset: demo_mlexpec, filters: {sex: T, age: Y_LT1, unit: YR}}
    regionaal: {instelling: Eurostat, dataset: demo_r_mlifexp, filters: {sex: T, age: Y_LT1, unit: YR}, landen: [BE1, BE2, BE3]}

  - id: zorguitgaven
    thema: gezondheid
    titel: {nl: Uitgaven aan gezondheidszorg}
    vraag: {nl: "Hoeveel geven we uit aan zorg?"}
    definitie: {nl: Totale uitgaven aan gezondheidszorg, publiek en privé, in procent van het bbp.}
    uitleg: {nl: "Wat de overheid, de ziekenfondsen, verzekeraars en patiënten zelf samen aan zorg uitgeven."}
    eenheid: "% bbp"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [zorg, ziekenhuis, riziv, ziekenfonds]
    bron: {instelling: Eurostat, dataset: hlth_sha11_hf, filters: {unit: PC_GDP, icha11_hf: TOT_HF}}

  # ---------- Onderwijs ----------
  - id: diploma_hoger_onderwijs
    thema: onderwijs
    titel: {nl: Diploma hoger onderwijs}
    vraag: {nl: "Hoeveel jonge volwassenen hebben een diploma hoger onderwijs?"}
    definitie: {nl: Aandeel 25- tot 34-jarigen met een diploma hoger onderwijs.}
    uitleg: {nl: "Het gaat over mensen tussen 25 en 34 jaar met een bachelor, master of gelijkwaardig diploma."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "25- tot 34-jarigen heeft een diploma hoger onderwijs"}
    zoekwoorden: [hogeschool, universiteit, diploma, studeren]
    bron: {instelling: Eurostat, dataset: edat_lfse_03, filters: {isced11: ED5-8, sex: T, age: Y25-34, unit: PC}}
    regionaal: {instelling: Eurostat, dataset: edat_lfse_04, filters: {sex: T, isced11: ED5-8, age: Y25-34, unit: PC}, landen: [BE1, BE2, BE3]}

  - id: vroegtijdige_schoolverlaters
    thema: onderwijs
    titel: {nl: Vroegtijdige schoolverlaters}
    vraag: {nl: "Hoeveel jongeren stoppen met school zonder diploma?"}
    definitie: {nl: Aandeel 18- tot 24-jarigen zonder diploma secundair onderwijs dat geen opleiding meer volgt.}
    uitleg: {nl: "Jongeren zonder diploma secundair onderwijs hebben het vaak moeilijker op de arbeidsmarkt."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "jongeren van 18 tot 24 jaar heeft geen diploma secundair en volgt geen opleiding meer"}
    zoekwoorden: [schoolverlaters, ongekwalificeerd, school, diploma]
    bron: {instelling: Eurostat, dataset: edat_lfse_14, filters: {sex: T, wstatus: POP, age: Y18-24, unit: PC}}
    regionaal: {instelling: Eurostat, dataset: edat_lfse_16, filters: {sex: T, unit: PC}, landen: [BE1, BE2, BE3]}

  # ---------- Wonen en armoede ----------
  - id: armoede_uitsluiting
    thema: wonen_armoede
    titel: {nl: Risico op armoede}
    vraag: {nl: "Hoeveel mensen lopen risico op armoede?"}
    definitie: {nl: Aandeel van de bevolking met een laag inkomen, ernstige materiële ontbering of een zeer lage werkintensiteit (AROPE).}
    uitleg: {nl: "Dit is de Europese maatstaf. Je telt mee als je een laag inkomen hebt, je basisdingen niet kunt veroorloven, of in een gezin woont waar bijna niemand werkt."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "inwoners loopt risico op armoede of sociale uitsluiting"}
    zoekwoorden: [armoede, arm, rondkomen, uitsluiting, arope]
    bron: {instelling: Eurostat, dataset: ilc_peps01n, filters: {unit: PC, age: TOTAL, sex: T}}
    regionaal: {instelling: Eurostat, dataset: ilc_peps11n, filters: {unit: PC}, landen: [BE1, BE2, BE3]}

  - id: woningprijzen
    thema: wonen_armoede
    titel: {nl: Woningprijzen}
    vraag: {nl: "Hoeveel duurder worden woningen per jaar?"}
    definitie: {nl: Jaarlijkse stijging van de prijzen van woningen (huizenprijsindex).}
    uitleg: {nl: "Hoeveel de prijs van een woning gemiddeld stijgt of daalt tegenover het jaar ervoor, nieuwe en bestaande woningen samen."}
    eenheid: "%"
    decimalen: 1
    weergave: kolommen
    zoekwoorden: [huis, huizenprijzen, vastgoed, kopen]
    bron: {instelling: Eurostat, dataset: prc_hpi_a, filters: {purchase: TOTAL, unit: RCH_A_AVG}}

  # ---------- Klimaat en energie ----------
  - id: hernieuwbare_energie
    thema: klimaat_energie
    titel: {nl: Hernieuwbare energie}
    vraag: {nl: "Hoeveel van onze energie komt uit hernieuwbare bronnen?"}
    definitie: {nl: Aandeel hernieuwbare bronnen in het bruto eindverbruik van energie.}
    uitleg: {nl: "Het gaat over alle energie: elektriciteit, maar ook verwarming en transport. Zon, wind, biomassa en waterkracht tellen als hernieuwbaar."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [zonnepanelen, windmolens, groene stroom, energie]
    bron: {instelling: Eurostat, dataset: nrg_ind_ren, filters: {nrg_bal: REN, unit: PC}}

  - id: uitstoot_per_inwoner
    thema: klimaat_energie
    titel: {nl: Uitstoot per inwoner}
    vraag: {nl: "Hoeveel broeikasgassen stoten we per persoon uit?"}
    definitie: {nl: Netto uitstoot van broeikasgassen per inwoner, in ton CO₂-equivalent.}
    uitleg: {nl: "De uitstoot van het hele land (verkeer, industrie, verwarming, landbouw) gedeeld door het aantal inwoners. Bossen die CO₂ opnemen, worden ervan afgetrokken."}
    eenheid: " ton"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [co2, klimaat, uitstoot, broeikasgassen]
    # TOTXMEMO = totaal inclusief landgebruik en bossen (LULUCF), dus de netto uitstoot
    bron: {instelling: Eurostat, dataset: sdg_13_10, filters: {unit: T_HAB, src_crf: TOTXMEMO}}

  - id: kernenergie_aandeel
    thema: klimaat_energie
    titel: {nl: Kernenergie in onze stroom}
    vraag: {nl: "Hoeveel van onze elektriciteit komt uit kerncentrales?"}
    definitie: {nl: Aandeel kernenergie in de bruto elektriciteitsproductie van het land.}
    uitleg: {nl: "Het gaat enkel over elektriciteit, niet over alle energie. Kerncentrales stoten bij het draaien vrijwel geen broeikasgassen uit, maar kernenergie telt niet als hernieuwbare energie. Stroom die we invoeren uit het buitenland zit niet in dit cijfer."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    zoekwoorden: [kernenergie, kerncentrale, nucleair, doel, tihange, elektriciteit, stroom]
    afgeleid:
      formule: "nucleair * 100 / totaal"
      invoer: {nucleair: elektriciteit_nucleair, totaal: elektriciteit_totaal}

  - id: elektriciteit_nucleair
    thema: klimaat_energie
    titel: {nl: Elektriciteit uit kernenergie}
    vraag: {nl: "Hoeveel elektriciteit maken kerncentrales?"}
    definitie: {nl: Bruto elektriciteitsproductie uit kernenergie, in gigawattuur.}
    eenheid: " GWh"
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: nrg_ind_peh, filters: {siec: N9000, unit: GWH, nrg_bal: GEP}}

  - id: elektriciteit_totaal
    thema: klimaat_energie
    titel: {nl: Elektriciteitsproductie}
    vraag: {nl: "Hoeveel elektriciteit produceren we?"}
    definitie: {nl: Totale bruto elektriciteitsproductie, in gigawattuur.}
    eenheid: " GWh"
    decimalen: 0
    verborgen: true
    bron: {instelling: Eurostat, dataset: nrg_ind_peh, filters: {siec: TOTAL, unit: GWH, nrg_bal: GEP}}

  # ---------- Mobiliteit ----------
  - id: treinstiptheid
    thema: mobiliteit
    titel: {nl: Stiptheid van de treinen}
    vraag: {nl: "Hoeveel treinen komen op tijd aan?"}
    definitie: {nl: "Aandeel binnenlandse reizigerstreinen dat met minder dan 6 minuten vertraging op de eindbestemming aankomt, per jaar (alle maanden samen)."}
    uitleg: {nl: "Een trein met 6 minuten vertraging of meer telt als te laat. Afgeschafte treinen tellen in dit cijfer niet mee. Voor het lopende jaar gaat het over de maanden tot nu."}
    eenheid: "%"
    decimalen: 1
    weergave: kolommen
    beeld: wafel
    wafel_tekst: {nl: "treinen kwam op tijd aan"}
    landen: [BE]
    zoekwoorden: [trein, nmbs, infrabel, vertraging, te laat, spoor]
    bron:
      instelling: Infrabel
      dataset: nationale-stiptheid-per-maand
      maandveld: maand
      teller: reg
      noemer: tel

  - id: verkeersdoden
    thema: mobiliteit
    titel: {nl: Verkeersdoden}
    vraag: {nl: "Hoeveel mensen sterven er in het verkeer?"}
    definitie: {nl: Aantal mensen dat binnen 30 dagen na een verkeersongeval overlijdt, per miljoen inwoners.}
    uitleg: {nl: "Per miljoen inwoners, zodat je landen van verschillende grootte kunt vergelijken."}
    eenheid: " per miljoen"
    decimalen: 0
    weergave: lijn
    zoekwoorden: [ongevallen, verkeersveiligheid, auto, fiets]
    bron: {instelling: Eurostat, dataset: sdg_11_40, filters: {unit: RT, tra_infr: TOTAL}}

  # ---------- Bevolking ----------
  - id: bevolking
    thema: demografie
    titel: {nl: Inwoners}
    vraag: {nl: "Hoeveel mensen wonen er in België?"}
    definitie: {nl: Aantal inwoners op 1 januari.}
    uitleg: {nl: "Iedereen die officieel in België woont, ingeschreven in het Rijksregister."}
    eenheid: ""
    decimalen: 0
    weergave: kolommen
    landen: [BE]
    zoekwoorden: [inwoners, bevolking, mensen]
    bron: {instelling: Eurostat, dataset: tps00001, filters: {indic_de: JAN}}
    regionaal: {instelling: Eurostat, dataset: demo_r_d2jan, filters: {sex: T, age: TOTAL, unit: NR}, landen: [BE1, BE2, BE3]}

  - id: aandeel_65plus
    thema: demografie
    titel: {nl: 65-plussers}
    vraag: {nl: "Hoeveel inwoners zijn 65 jaar of ouder?"}
    definitie: {nl: Aandeel van de bevolking dat 65 jaar of ouder is.}
    uitleg: {nl: "Hoe groter dit aandeel, hoe meer er nodig is voor pensioenen en zorg, en hoe minder mensen op werkleeftijd er zijn om dat te betalen."}
    eenheid: "%"
    decimalen: 1
    weergave: lijn
    beeld: wafel
    wafel_tekst: {nl: "inwoners is 65 jaar of ouder"}
    zoekwoorden: [ouderen, vergrijzing, pensioen, senioren]
    bron: {instelling: Eurostat, dataset: demo_pjanind, filters: {indic_de: PC_Y65_MAX}}
    regionaal: {instelling: Eurostat, dataset: demo_r_pjanind2, filters: {indic_de: PC_Y65_MAX, unit: PC}, landen: [BE1, BE2, BE3]}
