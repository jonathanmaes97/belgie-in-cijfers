snel:
  consumentenvertrouwen:
    titel: Consumer confidence
    vraag: How optimistic are households?
    uitleg: "A monthly survey of households about the economy, unemployment, their own finances and saving. Zero is neutral: a negative figure means more pessimists than optimists."
  conjunctuurbarometer:
    titel: Business barometer
    vraag: How do businesses see things?
    uitleg: "The National Bank's barometer summarises the monthly business surveys (industry, construction, trade and services). It is mainly used to see the direction: if it rises, businesses are more positive."
  werkloosheid_maand:
    titel: Unemployment this month
    vraag: How many people are looking for work right now?
    uitleg: "Unemployment rate according to the international definition, seasonally adjusted, so you can compare months with each other."
    vergelijk: EU
  bbp_kwartaal:
    titel: Growth this quarter
    vraag: Is the economy growing right now?
    uitleg: "GDP growth (after inflation) compared with the previous quarter, adjusted for seasonal and calendar effects. Two consecutive quarters of contraction are often called a recession."

