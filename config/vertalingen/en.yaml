# English translation of the content texts. Keys follow config/indicatoren.yaml.
# No figures here: figures always come from the data.
themas:
  economie:
    nl: Economy
    vraag: Is our economy growing?
    intro: The economy is everything we produce and earn together. When it grows, there is usually more work and more money for wages and public services. Here you can see how fast the Belgian economy is growing, how much we produce per person and how fast prices are rising.
    bevoegd: The European Central Bank sets interest rates in the euro area. In Belgium, economic policy is shared between the federal government (for example taxes) and the regions (for example support for businesses and investment).
  overheidsfinancien:
    nl: Public finances
    vraag: What state are the public finances in?
    intro: The government collects taxes and social contributions and spends that money on pensions, healthcare, education and roads, among other things. If it spends more than it receives, there is a deficit and the debt rises. The government pays interest on that debt.
    bevoegd: 'Every government has its own budget: the federal government, the communities, the regions and the local authorities. The figures here add them all together, as Europe requires.'
  werk:
    nl: Jobs
    vraag: How many people are working?
    intro: How many people have a job helps determine how much tax and contributions come in to pay for pensions and healthcare, among other things. Here you can see how many adults work, how many people are looking for work and for how long, how many older people are still working, and how many do not work because of illness.
    bevoegd: Labour law and unemployment benefits are federal. Supporting job seekers is a task for the regions and the German-speaking Community (VDAB, Le Forem, Actiris and ADG).
  gezondheid:
    nl: Health
    vraag: How healthy are we?
    intro: 'How long and how healthily we live depends on many things: care, lifestyle, work and income. Here you can see how many years we live on average and how many of them in good health, how many deaths were avoidable, whether people get the care they need, and how much we spend on care.'
    bevoegd: Health insurance and hospital funding are largely federal. Prevention, elderly care and primary care are mainly the responsibility of the communities.
  onderwijs:
    nl: Education
    vraag: How well educated are we?
    intro: A qualification increases the chance of a job and a good income. Here you can see how many young people leave school without a qualification, how many young adults have a higher education degree, and how many 15-year-olds fall short of the basic level in maths and reading in the international PISA test.
    bevoegd: 'In Belgium, education is the responsibility of the communities: the Flemish, French and German-speaking Communities each have their own education system.'
  wonen_armoede:
    nl: Housing and poverty
    vraag: Can everyone make ends meet?
    intro: Affordable housing and enough income to get by are basic needs. Here you can see how many people are at risk of poverty, how many go without basic things, who pays heavily for housing and how fast house prices are rising.
    bevoegd: Housing policy, such as social housing and rental rules, is the responsibility of the regions. Benefits and pensions are federal; the local public social welfare centres (OCMW/CPAS) help people locally.
  klimaat_energie:
    nl: Climate and energy
    vraag: How green is our energy?
    intro: 'Greenhouse gases are warming the planet. Europe wants emissions to fall and more energy to come from the sun, wind and other renewable sources. Here you can see how Belgium is doing: how much we emit, how much energy is renewable, what share of our electricity comes from nuclear power stations, and what electricity and gas cost for a household.'
    bevoegd: 'Responsibilities are shared: the federal government is responsible for offshore wind and nuclear energy, among other things, and the regions for onshore renewable energy and energy saving.'
  mobiliteit:
    nl: Mobility
    vraag: Do we get where we're going smoothly and safely?
    intro: How we travel determines how much time we spend on the road and how safe that is. Here you can see how punctual the trains are, how much we use the car and the train, how many cars there are and how many people die on the roads.
    bevoegd: The railways (SNCB/NMBS and Infrabel) are federal. Roads, road safety on regional roads, and buses and trams (De Lijn, TEC and STIB/MIVB) are the responsibility of the regions.
  demografie:
    nl: Population
    vraag: How many of us are there, and who is joining us?
    intro: How many people live in Belgium and how old they are determines how many schools, homes, care services and pensions are needed. The population changes through births and deaths, and through people moving to or leaving Belgium. Here you can see both.
    bevoegd: Population figures come from the National Register. Migration policy is federal; integration is the responsibility of the communities.
  veiligheid_justitie:
    nl: Safety and justice
    vraag: How is the justice system doing?
    intro: The justice system has to deliver judgements and have sentences carried out. Here you can see how many people are in prison and how full the prisons are.
    bevoegd: 'Justice, the courts and prisons are federal. The police work at two levels: the federal and the local police. Justice centres and support for prisoners are the responsibility of the communities.'
begrippen:
  bbp:
    term: GDP
    uitleg: 'Gross domestic product: the value of everything a country produces in a year. It is the usual measure of the size of an economy.'
  reeel:
    term: Real growth
    uitleg: Growth with the effect of price rises taken out. This shows whether we really produce more, not just at higher prices.
  inflatie:
    term: Inflation
    uitleg: How much the prices of what households buy rise on average in a year.
  procent_bbp:
    term: As a percentage of GDP
    uitleg: An amount compared with the size of the economy. This lets you compare countries of different sizes fairly.
  voorlopig:
    term: Provisional
    uitleg: A first figure that the source may still revise. We always show the latest version and keep track of revisions.
  werkzaamheidsgraad:
    term: Employment rate
    uitleg: The share of people aged 20 to 64 who work. Part-time workers count too.
  werkloosheidsgraad:
    term: Unemployment rate
    uitleg: The share of unemployed people among those who work or are actively looking for work. People who are not looking, such as students, do not count.
  hoger_onderwijs:
    term: Higher education
    uitleg: A bachelor's or master's degree, or equivalent training after secondary school.
  arope:
    term: Poverty or social exclusion
    uitleg: People who have a low income, cannot afford basic things (such as turning on the heating), or live in a household where almost nobody works.
  co2_equivalent:
    term: CO₂ equivalent
    uitleg: All greenhouse gases converted into the amount of CO₂ that would cause the same warming.
  gwh:
    term: Gigawatt hour (GWh)
    uitleg: 'A measure of an amount of electricity: one million kilowatt hours.'
  stiptheid:
    term: Punctuality
    uitleg: A train is punctual if it arrives at its final destination less than 6 minutes late. Cancelled trains are not included in this figure.
  vergrijzing:
    term: Ageing
    uitleg: The share of older people in the population is growing, because we live longer and fewer children are born.
landnamen:
  BE: Belgium
  EU27_2020: EU average
  NL: Netherlands
  DE: Germany
  FR: France
  LU: Luxembourg
  BE1: Brussels
  BE2: Flanders
  BE3: Wallonia
indicatoren:
  bbp_groei:
    titel: Economic growth
    vraag: How much does the economy grow each year?
    definitie: Annual growth of gross domestic product, adjusted for inflation.
    uitleg: A positive figure means that together we produced more than the year before. A negative figure, as in the COVID year 2020, means the economy shrank.
    zoekwoorden:
    - growth
    - recession
    - economy
    - gdp
  bbp_per_inwoner:
    titel: GDP per inhabitant
    vraag: How much do we produce per person?
    definitie: Gross domestic product divided by the number of inhabitants, at current prices.
    uitleg: A measure of a country's prosperity. It is not an income everyone receives, but total production divided by the number of inhabitants.
    zoekwoorden:
    - prosperity
    - wealth
    - income
  inflatie:
    titel: Inflation
    vraag: How much more expensive is life getting?
    definitie: Average annual rise in consumer prices (harmonised index, HICP).
    uitleg: With inflation of 3%, what cost 100 euros last year now costs 103 euros on average. In Belgium, many wages and benefits rise automatically with prices (indexation).
    zoekwoorden:
    - prices
    - index
    - indexation
    - cost of living
    - purchasing power
  schuld_per_inwoner:
    titel: Debt per inhabitant
    vraag: How much government debt is there per inhabitant?
    definitie: Government debt divided by the number of inhabitants on 1 January of the same year.
    uitleg: This is not an amount you have to pay yourself. It shows how large total government debt is if you divided it among all inhabitants.
    zoekwoorden:
    - national debt
    - debt
    - borrowing
  overheidsschuld:
    titel: Government debt
    vraag: How large is government debt compared with the economy?
    definitie: Consolidated gross debt of all levels of government together, as a percentage of GDP.
    uitleg: At 100%, the debt is as large as everything the country produces in a year. European rules ask for debt of at most 60%.
    norm: European standard 60%
    zoekwoorden:
    - national debt
    - debt ratio
    - maastricht
  begrotingssaldo:
    titel: Budget balance
    vraag: Does the government spend more than it receives?
    definitie: Surplus (+) or deficit (−) of all levels of government together, as a percentage of GDP.
    uitleg: 'A negative figure is a deficit: the government spent more than it received and had to borrow. European rules ask for a deficit of at most 3%.'
    norm: European standard −3%
    zoekwoorden:
    - deficit
    - budget
    - surplus
  rente_per_dag:
    titel: Interest per day
    vraag: How much interest does the government pay per day?
    definitie: Annual government interest payments divided by 365, in millions of euros.
    uitleg: Interest is the price the government pays to borrow money. That money cannot go to other spending.
    zoekwoorden:
    - interest
    - interest payments
  rentelasten:
    titel: Interest payments
    vraag: How much interest do we pay compared with the economy?
    definitie: Interest the government pays on its debt, as a percentage of GDP.
    uitleg: This lets you compare the interest burden of countries of different sizes.
    zoekwoorden:
    - interest
  belastingdruk:
    titel: Tax burden
    vraag: How much tax and contributions do we pay together?
    definitie: All taxes and social contributions together, as a percentage of GDP.
    uitleg: All taxes (on income, consumption, wealth) and social contributions together, compared with the size of the economy. It says nothing about what one person pays.
    zoekwoorden:
    - taxes
    - taxation
    - fiscal
    - social security
  belastingwig:
    titel: Tax burden on a lower wage
    vraag: How much of what an employer pays goes to taxes and contributions?
    definitie: 'Tax wedge: personal income tax plus employee and employer social contributions, as a percentage of total labour costs. For a single person without children earning 67% of the average wage (this is how Eurostat defines this series).'
    uitleg: 'Suppose an employer spends 100 euros on your wage. This figure shows how much of it goes to the government and social security, including your own income tax. You receive the rest as take-home pay. It concerns an example person: single, no children, with a wage of two thirds of the average. For higher wages the burden is higher, for the lowest wages it is lower.'
    wafel_tekst: euros of labour costs go to taxes and social contributions (single person, lower wage)
    zoekwoorden:
    - taxes
    - wage
    - salary
    - net
    - gross
    - labour cost
    - tax wedge
    - income tax
  werkzaamheidsgraad:
    titel: Employment rate
    vraag: How many adults have a job?
    definitie: Share of 20- to 64-year-olds who have a job.
    uitleg: Students, retirees under 65, the long-term sick and job seekers do not work and lower this figure. Belgium aims for 80% by 2030.
    norm: Belgian target for 2030 80%
    zoekwoorden:
    - jobs
    - employment
    - 80 percent
  werkloosheid:
    titel: Unemployment
    vraag: How many people are looking for work?
    definitie: Share of unemployed people in the labour force aged 15 to 74 (international definition).
    uitleg: 'According to the international definition: people without work who are actively looking and can start soon. This is not the same as the number of people receiving unemployment benefit.'
    zoekwoorden:
    - unemployed
    - job seekers
    - vdab
    - forem
    - actiris
  levensverwachting:
    titel: Life expectancy
    vraag: How old do we live to on average?
    definitie: Average number of years a newborn will live at that year's mortality rates.
    uitleg: How long a baby born this year will live on average, if the health of the population stays as it is now.
    zoekwoorden:
    - age
    - mortality
    - health
  zorguitgaven:
    titel: Healthcare spending
    vraag: How much do we spend on healthcare?
    definitie: Total healthcare expenditure, public and private, as a percentage of GDP.
    uitleg: What the government, health insurance funds, insurers and patients themselves spend on care together.
    zoekwoorden:
    - care
    - hospital
    - health insurance
  diploma_hoger_onderwijs:
    titel: Higher education degree
    vraag: How many young adults have a higher education degree?
    definitie: Share of 25- to 34-year-olds with a higher education degree.
    uitleg: This concerns people aged 25 to 34 with a bachelor's, master's or equivalent degree.
    wafel_tekst: 25- to 34-year-olds have a higher education degree
    zoekwoorden:
    - college
    - university
    - degree
    - studying
  vroegtijdige_schoolverlaters:
    titel: Early school leavers
    vraag: How many young people leave school without a qualification?
    definitie: Share of 18- to 24-year-olds without a secondary school qualification who are no longer in education or training.
    uitleg: Young people without a secondary school qualification often have a harder time on the labour market.
    wafel_tekst: young people aged 18 to 24 have no secondary qualification and are no longer in education or training
    zoekwoorden:
    - school leavers
    - dropouts
    - school
    - qualification
  armoede_uitsluiting:
    titel: Risk of poverty
    vraag: How many people are at risk of poverty?
    definitie: Share of the population with a low income, severe material deprivation or very low work intensity (AROPE).
    uitleg: This is the European measure. You are counted if you have a low income, cannot afford basic things, or live in a household where almost nobody works.
    wafel_tekst: inhabitants are at risk of poverty or social exclusion
    zoekwoorden:
    - poverty
    - poor
    - making ends meet
    - exclusion
    - arope
  woningprijzen:
    titel: House prices
    vraag: How much more expensive do homes get each year?
    definitie: Annual rise in house prices (house price index).
    uitleg: How much the price of a home rises or falls on average compared with the year before, new and existing homes together.
    zoekwoorden:
    - house
    - house prices
    - property
    - real estate
    - buying
  hernieuwbare_energie:
    titel: Renewable energy
    vraag: How much of our energy comes from renewable sources?
    definitie: Share of renewable sources in gross final energy consumption.
    uitleg: 'This covers all energy: electricity, but also heating and transport. Sun, wind, biomass and hydropower count as renewable.'
    zoekwoorden:
    - solar panels
    - wind turbines
    - green electricity
    - energy
  uitstoot_per_inwoner:
    titel: Emissions per inhabitant
    vraag: How much greenhouse gas do we emit per person?
    definitie: Net greenhouse gas emissions per inhabitant, in tonnes of CO₂ equivalent.
    uitleg: The emissions of the whole country (transport, industry, heating, agriculture) divided by the number of inhabitants. Forests that absorb CO₂ are deducted.
    zoekwoorden:
    - co2
    - climate
    - emissions
    - greenhouse gases
  kernenergie_aandeel:
    titel: Nuclear power in our electricity
    vraag: How much of our electricity comes from nuclear power stations?
    definitie: Share of nuclear power in the country's gross electricity production.
    uitleg: This concerns electricity only, not all energy. Nuclear power stations emit virtually no greenhouse gases while running, but nuclear power does not count as renewable energy. Electricity imported from abroad is not included in this figure.
    zoekwoorden:
    - nuclear
    - nuclear power station
    - doel
    - tihange
    - electricity
    - power
  treinstiptheid:
    titel: Train punctuality
    vraag: How many trains arrive on time?
    definitie: Share of domestic passenger trains arriving at their final destination less than 6 minutes late, per year (all months together).
    uitleg: A train that is 6 or more minutes late counts as late. Cancelled trains are not included in this figure. For the current year, it covers the months so far.
    wafel_tekst: trains arrived on time
    zoekwoorden:
    - train
    - sncb
    - nmbs
    - infrabel
    - delay
    - late
    - railway
  verkeersdoden:
    titel: Road deaths
    vraag: How many people die on the roads?
    definitie: Number of people who die within 30 days of a road accident, per million inhabitants.
    uitleg: Per million inhabitants, so you can compare countries of different sizes.
    zoekwoorden:
    - accidents
    - road safety
    - car
    - bicycle
  bevolking:
    titel: Inhabitants
    vraag: How many people live in Belgium?
    definitie: Number of inhabitants on 1 January.
    uitleg: Everyone who officially lives in Belgium and is registered in the National Register.
    zoekwoorden:
    - inhabitants
    - population
    - people
  aandeel_65plus:
    titel: People aged 65 and over
    vraag: How many inhabitants are 65 or older?
    definitie: Share of the population aged 65 or over.
    uitleg: The larger this share, the more is needed for pensions and care, and the fewer people of working age there are to pay for it.
    wafel_tekst: inhabitants are 65 or older
    zoekwoorden:
    - elderly
    - ageing
    - pension
    - seniors
  netto_migratie:
    titel: Net migration
    vraag: How many people are added through migration, on balance?
    definitie: Number of people moving to the country minus the number leaving, per 1,000 inhabitants (including statistical adjustment).
    uitleg: This covers everyone who moves, including Belgians who leave for abroad or come back. A positive figure means more people come to live here than leave.
    zoekwoorden:
    - migration
    - immigration
    - emigration
    - migrants
    - moving
  natuurlijke_aangroei:
    titel: Natural increase
    vraag: Are more people born than die?
    definitie: Number of births minus the number of deaths, per 1,000 inhabitants.
    uitleg: Together with net migration, this determines whether the population grows. A negative figure means more people die than are born.
    zoekwoorden:
    - births
    - deaths
    - mortality
    - babies
    - increase
  geboren_buitenland:
    titel: Born abroad
    vraag: How many inhabitants were born abroad?
    definitie: Share of inhabitants born outside the country, regardless of their nationality.
    uitleg: 'The country of birth says nothing about nationality: Belgians born abroad are counted too, while children of migrants born here are not.'
    wafel_tekst: inhabitants were born abroad
    zoekwoorden:
    - migration
    - migrants
    - abroad
    - origin
    - newcomers
  asielaanvragen:
    titel: First-time asylum applications
    vraag: How many people apply for asylum for the first time?
    definitie: Number of people who submit an application for international protection for the first time in that year.
    uitleg: 'An asylum application is not yet a recognition: some applications are rejected. Only first applications count here, not repeated ones.'
    zoekwoorden:
    - asylum
    - refugees
    - asylum seekers
    - reception
    - protection
  pisa_wiskunde:
    titel: Low achievers in maths (PISA)
    vraag: How many 15-year-olds fall short of the basic level in maths?
    definitie: Share of 15-year-olds scoring below level 2 in mathematics in the OECD PISA test.
    uitleg: PISA is an international test taken by 15-year-olds every few years. Those below level 2 struggle with simple applications, such as comparing prices or reading a simple chart. Education is the responsibility of the communities; Eurostat only publishes the figure for Belgium as a whole.
    wafel_tekst: 15-year-olds fall short of the basic level in maths
    zoekwoorden:
    - pisa
    - maths
    - mathematics
    - pupils
    - schools
    - oecd
  pisa_lezen:
    titel: Low achievers in reading (PISA)
    vraag: How many 15-year-olds fall short of the basic level in reading?
    definitie: Share of 15-year-olds scoring below level 2 in reading in the OECD PISA test.
    uitleg: Those below level 2 find it hard to identify the main idea of an ordinary text. As with maths, this covers Belgium as a whole; results per community appear in separate national reports.
    zoekwoorden:
    - pisa
    - reading
    - literacy
    - language
    - pupils
    - oecd
  stroomprijs:
    titel: Electricity price
    vraag: What does a kilowatt hour of electricity cost a household?
    definitie: Average price for households using 2,500 to 4,999 kWh per year, including all taxes and levies. Eurostat publishes two figures per year (per half-year); this is the average of both.
    uitleg: An average household uses a few thousand kilowatt hours a year. The price includes the energy itself, network costs, taxes and VAT. Your own contract may be considerably more or less expensive.
    zoekwoorden:
    - electricity
    - power
    - energy price
    - energy bill
    - kwh
    - energy
  gasprijs:
    titel: Natural gas price
    vraag: What does a kilowatt hour of gas cost a household?
    definitie: Average price for households using 20 to 199 gigajoules per year, including all taxes and levies. Eurostat publishes two figures per year (per half-year); this is the average of both.
    uitleg: This consumption fits a household that heats with gas. Gas is cheaper per kilowatt hour than electricity, but you need much more of it for heating. Your own contract may differ considerably.
    zoekwoorden:
    - gas
    - natural gas
    - heating
    - energy price
    - energy bill
    - energy
  pensioenuitgaven:
    titel: Pension spending
    vraag: How much do we spend on pensions?
    definitie: All spending on pensions (old-age, early, disability and survivors' pensions), as a percentage of GDP (European ESSPROS classification).
    uitleg: Pensions are the largest spending item of social security. Because we live longer and there are more older people, this figure rises if nothing changes. It says nothing about how high one pension is.
    zoekwoorden:
    - pension
    - pensions
    - ageing
    - retirement
    - social security
  defensie_uitgaven:
    titel: Defence spending
    vraag: How much does the government spend on defence?
    definitie: Government spending on defence (function GF02 in the European COFOG classification), as a percentage of GDP.
    uitleg: Military spending, the army and military aid to other countries. NATO uses its own, somewhat broader definition, so its figures may be somewhat higher.
    zoekwoorden:
    - defence
    - army
    - nato
    - military
    - security
  langdurige_werkloosheid:
    titel: Long-term unemployment
    vraag: How many job seekers have been looking for more than a year?
    definitie: Share of unemployed people (aged 15 to 74, international definition) who have been looking for work for at least twelve months.
    uitleg: The longer someone looks for work, the harder it usually becomes to get back into a job.
    zoekwoorden:
    - long-term unemployed
    - unemployment
    - job seekers
    - activation
    wafel_tekst: unemployed people have been looking for work for more than a year
  werkzaamheid_55_64:
    titel: Workers aged 55 and over
    vraag: How many people aged 55 to 64 are still working?
    definitie: Share of 55- to 64-year-olds who have a job.
    uitleg: 'This figure plays a role in the debate about pensions and working longer: the more older people work, the more contributions come in.'
    zoekwoorden:
    - older workers
    - working longer
    - retirement age
    - end of career
  inactief_ziekte:
    titel: Not working due to illness
    vraag: How many people of working age do not work because of illness or disability?
    definitie: Share of 20- to 64-year-olds who are not working and not looking for work, with their own illness or disability as the main reason (European Labour Force Survey).
    uitleg: This is what people themselves answer in a survey, not the number of people receiving sickness benefit. It does give a picture of how many people are out of work because of their health.
    zoekwoorden:
    - long-term sick
    - illness
    - disability
    - incapacity for work
    - riziv
  gezonde_levensjaren:
    titel: Healthy life years
    vraag: How many years do we live in good health?
    definitie: Number of years a newborn can expect to live without limitations in daily life due to health problems.
    uitleg: Living long is one thing, living healthily another. The difference with life expectancy is the years we live on average with limitations. The figure is based on what people themselves answer in a survey.
    zoekwoorden:
    - healthy
    - life years
    - health
    - limitation
    - ageing
  vermijdbare_sterfte:
    titel: Avoidable mortality
    vraag: How many people die early from something avoidable?
    definitie: Deaths before the age of 75 that could have been avoided through prevention or through timely, good-quality care, per 100,000 inhabitants (age-standardised).
    uitleg: Think of lung cancer from smoking, road accidents or a treatable infection. The figure says something about prevention and the quality of care together.
    zoekwoorden:
    - mortality
    - prevention
    - avoidable
    - quality of care
    - premature death
  onvervulde_zorg:
    titel: Going without care
    vraag: How many people do not get the care they need?
    definitie: Share of inhabitants aged 16 and over who say they needed a medical examination or treatment but did not get it, because it was too expensive, too far away or the waiting list was too long.
    uitleg: This is what people themselves answer in a European survey. Among people on low incomes this figure is usually higher than average.
    zoekwoorden:
    - access to care
    - waiting list
    - too expensive
    - doctor
    - affordability of care
  verpleegkundigen:
    titel: Nurses
    vraag: How many nurses are working?
    definitie: Number of practising nurses with an EU-recognised qualification, per 100,000 inhabitants.
    uitleg: 'Practising means: they actually care for patients. Countries do not all count nurses the same way, so compare with caution.'
    zoekwoorden:
    - nursing
    - nurses
    - health workforce
    - shortage
    - hospital
  woonkosten_zwaar:
    titel: Heavy housing costs
    vraag: How many people spend a large share of their income on housing?
    definitie: Share of the population living in a household that spends more than 40% of its disposable income on housing (rent or mortgage interest, energy, water and maintenance).
    uitleg: Those who spend that much on housing have little left for everything else. Tenants on low incomes are more often in this situation than owners.
    zoekwoorden:
    - rent
    - housing costs
    - affordable housing
    - tenants
    - housing
  ernstige_ontbering:
    titel: Severe deprivation
    vraag: How many people go without basic things?
    definitie: Share of the population who cannot afford at least 7 of 13 basic items, such as keeping the home adequately warm, paying an unexpected bill or taking a week's holiday.
    uitleg: While the risk of poverty is mainly about income, this figure looks at what people really cannot afford in daily life.
    zoekwoorden:
    - poverty
    - deprivation
    - heating
    - making ends meet
    - material deprivation
  auto_aandeel:
    titel: Share of the car
    vraag: How much of our travel do we do by car?
    definitie: Share of the car in all inland passenger-kilometres by car, bus, coach and train (cycling and walking are not included).
    uitleg: This is about kilometres travelled, not the number of trips. Cycling and walking are not part of this European statistic.
    zoekwoorden:
    - car
    - traffic jams
    - modal split
    - public transport
    - traffic
    wafel_tekst: inland passenger-kilometres are travelled by car
  trein_aandeel:
    titel: Share of the train
    vraag: How much of our travel do we do by train?
    definitie: Share of the train in all inland passenger-kilometres by car, bus, coach and train.
    uitleg: Together with the share of the car and of buses and coaches, this makes up one hundred percent of the passenger-kilometres in this statistic.
    zoekwoorden:
    - train
    - sncb
    - nmbs
    - public transport
    - modal split
    - railway
  autos_per_1000:
    titel: Cars per inhabitant
    vraag: How many passenger cars are there per 1,000 inhabitants?
    definitie: Number of registered passenger cars per 1,000 inhabitants.
    uitleg: Company cars registered in the name of a company are also counted.
    zoekwoorden:
    - car
    - car fleet
    - company cars
    - car ownership
  gevangenis_bezetting:
    titel: Prison occupancy
    vraag: How full are the prisons?
    definitie: Number of people in prison divided by the official capacity, as a percentage. Above one hundred, there are more people than places.
    uitleg: 'Overcrowding means more people per cell, less support and more tension for prisoners and staff. The figure is an average: some prisons are much fuller than others.'
    zoekwoorden:
    - prison
    - overcrowding
    - detention
    - justice
    - prisoners
  gevangenen_per_100000:
    titel: Prisoners per inhabitant
    vraag: How many people are in prison?
    definitie: Number of people in prison per 100,000 inhabitants.
    uitleg: This also includes people in pre-trial detention, who have not yet been convicted.
    zoekwoorden:
    - prisoners
    - inmates
    - prison
    - sentences
