# English translation of the content texts. Keys follow config/indicatoren.yaml.
# No figures here: figures always come from the data.
themas:
  economie:
    nl: Economy
    vraag: Is our economy growing?
    intro: "The economy is everything we produce and earn together. When it grows, there is usually more work and more money for wages and public services. Here you can see how fast the Belgian economy is growing, how much we produce per person and how fast prices are rising."
    bevoegd: "The European Central Bank sets interest rates in the euro area. In Belgium, economic policy is shared between the federal government (for example taxes) and the regions (for example support for businesses and investment)."
  overheidsfinancien:
    nl: Public finances
    vraag: What state are the public finances in?
    intro: "The government collects taxes and social contributions and spends that money on pensions, healthcare, education and roads, among other things. If it spends more than it receives, there is a deficit and the debt rises. The government pays interest on that debt."
    bevoegd: "Every government has its own budget: the federal government, the communities, the regions and the local authorities. The figures here add them all together, as Europe requires."
  werk:
    nl: Jobs
    vraag: How many people are working?
    intro: "How many people have a job helps determine how much tax and contributions come in to pay for pensions and healthcare, among other things. Here you can see how many adults work and how many people are looking for work, including by region."
    bevoegd: "Labour law and unemployment benefits are federal. Supporting job seekers is a task for the regions and the German-speaking Community (VDAB, Le Forem, Actiris and ADG)."
  gezondheid:
    nl: Health
    vraag: How healthy are we?
    intro: "How long and how healthily we live depends on many things: care, lifestyle, work and income. Here you can see how long people live on average and how much we spend together on healthcare."
    bevoegd: "Health insurance and hospital funding are largely federal. Prevention, elderly care and primary care are mainly the responsibility of the communities."
  onderwijs:
    nl: Education
    vraag: How well educated are we?
    intro: "A qualification increases the chance of a job and a good income. Here you can see how many young people leave school without a qualification and how many young adults have a higher education degree."
    bevoegd: "In Belgium, education is the responsibility of the communities: the Flemish, French and German-speaking Communities each have their own education system."
  wonen_armoede:
    nl: Housing and poverty
    vraag: Can everyone make ends meet?
    intro: "Affordable housing and enough income to get by are basic needs. Here you can see how many people are at risk of poverty or social exclusion and how fast house prices are rising."
    bevoegd: "Housing policy, such as social housing and rental rules, is the responsibility of the regions. Benefits and pensions are federal; the local public social welfare centres (OCMW/CPAS) help people locally."
  klimaat_energie:
    nl: Climate and energy
    vraag: How green is our energy?
    intro: "Greenhouse gases are warming the planet. Europe wants emissions to fall and more energy to come from the sun, wind and other renewable sources. Here you can see how Belgium is doing: how much we emit, how much energy is renewable and what share of our electricity comes from nuclear power stations."
    bevoegd: "Responsibilities are shared: the federal government is responsible for offshore wind and nuclear energy, among other things, and the regions for onshore renewable energy and energy saving."
  mobiliteit:
    nl: Mobility
    vraag: Do we get where we're going smoothly and safely?
    intro: "How we travel determines how much time we spend on the road and how safe that is. Here you can see how punctual the trains are and how many people die on the roads."
    bevoegd: "The railways (SNCB/NMBS and Infrabel) are federal. Roads, road safety on regional roads, and buses and trams (De Lijn, TEC and STIB/MIVB) are the responsibility of the regions."
  demografie:
    nl: Population
    vraag: How many of us are there, and who is joining us?
    intro: "How many people live in Belgium and how old they are determines how many schools, homes, care services and pensions are needed. The population changes through births and deaths, and through people moving to or leaving Belgium. Here you can see both."
    bevoegd: "Population figures come from the National Register. Migration policy is federal; integration is the responsibility of the communities."

begrippen:
  bbp: {term: GDP, uitleg: "Gross domestic product: the value of everything a country produces in a year. It is the usual measure of the size of an economy."}
  reeel: {term: Real growth, uitleg: "Growth with the effect of price rises taken out. This shows whether we really produce more, not just at higher prices."}
  inflatie: {term: Inflation, uitleg: "How much the prices of what households buy rise on average in a year."}
  procent_bbp: {term: As a percentage of GDP, uitleg: "An amount compared with the size of the economy. This lets you compare countries of different sizes fairly."}
  voorlopig: {term: Provisional, uitleg: "A first figure that the source may still revise. We always show the latest version and keep track of revisions."}
  werkzaamheidsgraad: {term: Employment rate, uitleg: "The share of people aged 20 to 64 who work. Part-time workers count too."}
  werkloosheidsgraad: {term: Unemployment rate, uitleg: "The share of unemployed people among those who work or are actively looking for work. People who are not looking, such as students, do not count."}
  hoger_onderwijs: {term: Higher education, uitleg: "A bachelor's or master's degree, or equivalent training after secondary school."}
  arope: {term: Poverty or social exclusion, uitleg: "People who have a low income, cannot afford basic things (such as turning on the heating), or live in a household where almost nobody works."}
  co2_equivalent: {term: CO₂ equivalent, uitleg: "All greenhouse gases converted into the amount of CO₂ that would cause the same warming."}
  gwh: {term: Gigawatt hour (GWh), uitleg: "A measure of an amount of electricity: one million kilowatt hours."}
  stiptheid: {term: Punctuality, uitleg: "A train is punctual if it arrives at its final destination less than 6 minutes late. Cancelled trains are not included in this figure."}
  vergrijzing: {term: Ageing, uitleg: "The share of older people in the population is growing, because we live longer and fewer children are born."}

landnamen:
  BE: Belgium
  EU27_2020: EU average
  NL: Netherlands
  DE: Germany
