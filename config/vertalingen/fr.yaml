# Traduction française des textes de contenu. Les clés suivent config/indicatoren.yaml.
# Aucun chiffre ici : les chiffres viennent toujours des données.
themas:
  economie:
    nl: Économie
    vraag: Notre économie croît-elle ?
    intro: L'économie, c'est tout ce que nous produisons et gagnons ensemble. Quand elle croît, il y a généralement plus d'emplois et plus d'argent pour les salaires et les services publics. Vous voyez ici à quelle vitesse l'économie belge croît, combien nous produisons par personne et à quelle vitesse les prix augmentent.
    bevoegd: La Banque centrale européenne fixe les taux d'intérêt de la zone euro. En Belgique, la politique économique est partagée entre l'État fédéral (par exemple les impôts) et les régions (par exemple l'aide aux entreprises et les investissements).
  overheidsfinancien:
    nl: Finances publiques
    vraag: Comment se portent les caisses de l'État ?
    intro: Les pouvoirs publics perçoivent des impôts et des cotisations sociales et dépensent cet argent notamment pour les pensions, les soins de santé, l'enseignement et les routes. S'ils dépensent plus qu'ils ne reçoivent, il y a un déficit et la dette augmente. Sur cette dette, l'État paie des intérêts.
    bevoegd: 'Chaque niveau de pouvoir a son propre budget : l''État fédéral, les communautés, les régions et les pouvoirs locaux. Les chiffres présentés ici les additionnent tous, comme l''exige l''Europe.'
  werk:
    nl: Emploi
    vraag: Combien de personnes travaillent ?
    intro: Le nombre de personnes qui ont un emploi détermine en partie les impôts et cotisations qui rentrent pour payer, entre autres, les pensions et les soins de santé. Vous voyez ici combien d'adultes travaillent, combien de personnes cherchent un emploi et depuis combien de temps combien de personnes plus âgées travaillent encore et combien de personnes sont malades de longue durée.
    bevoegd: Le droit du travail et les allocations de chômage sont fédéraux. L'accompagnement des demandeurs d'emploi est une mission des régions et de la Communauté germanophone (VDAB, Le Forem, Actiris et ADG).
  gezondheid:
    nl: Santé
    vraag: Sommes-nous en bonne santé ?
    intro: 'Combien de temps et en quelle santé nous vivons dépend de nombreux facteurs : les soins, le mode de vie, le travail et les revenus. Vous voyez ici combien d''années nous vivons en moyenne, et combien en bonne santé, combien de décès étaient évitables, si les gens reçoivent les soins dont ils ont besoin, et combien nous dépensons pour les soins.'
    bevoegd: L'assurance maladie et le financement des hôpitaux sont en grande partie fédéraux. La prévention, les soins aux personnes âgées et la première ligne relèvent surtout des communautés.
  onderwijs:
    nl: Enseignement
    vraag: Quel est notre niveau d'études ?
    intro: Un diplôme augmente les chances de trouver un emploi et d'avoir un bon revenu. Vous voyez ici combien de jeunes quittent l'école sans diplôme, combien de jeunes adultes ont un diplôme de l'enseignement supérieur, et combien de jeunes de 15 ans n'atteignent pas le niveau de base en mathématiques et en lecture dans le test international PISA.
    bevoegd: 'En Belgique, l''enseignement est une compétence des communautés : les Communautés flamande, française et germanophone ont chacune leur propre enseignement.'
  wonen_armoede:
    nl: Logement et pauvreté
    vraag: Tout le monde parvient-il à joindre les deux bouts ?
    intro: Un logement abordable et un revenu suffisant pour vivre sont des besoins de base. Vous voyez ici combien de personnes sont menacées de pauvreté, combien doivent se passer de choses de base, qui paie lourdement pour se loger et à quelle vitesse les prix des logements augmentent.
    bevoegd: La politique du logement, comme le logement social et les règles de location, est une compétence des régions. Les allocations et les pensions sont fédérales ; les CPAS aident les personnes au niveau local.
  klimaat_energie:
    nl: Climat et énergie
    vraag: Notre énergie est-elle verte ?
    intro: 'Les gaz à effet de serre réchauffent la planète. L''Europe veut que les émissions baissent et qu''une plus grande part de l''énergie provienne du soleil, du vent et d''autres sources renouvelables. Vous voyez ici où en est la Belgique : combien nous émettons, quelle part de l''énergie est renouvelable, quelle part de notre électricité provient des centrales nucléaires, et ce que coûtent l''électricité et le gaz pour un ménage.'
    bevoegd: 'Les compétences sont partagées : l''État fédéral est notamment compétent pour l''éolien en mer et l''énergie nucléaire, les régions pour les énergies renouvelables sur terre et les économies d''énergie.'
  mobiliteit:
    nl: Mobilité
    vraag: Arrivons-nous à destination facilement et en sécurité ?
    intro: Notre façon de nous déplacer détermine le temps passé en route et notre sécurité. Vous voyez ici la ponctualité des trains, la part de la voiture et du train, le nombre de voitures et combien de personnes meurent sur les routes.
    bevoegd: Le rail (SNCB et Infrabel) est fédéral. Les routes, la sécurité routière sur les routes régionales ainsi que les bus et trams (De Lijn, TEC et STIB) sont des compétences des régions.
  demografie:
    nl: Population
    vraag: Combien sommes-nous, et qui nous rejoint ?
    intro: Le nombre d'habitants en Belgique et leur âge déterminent combien d'écoles, de logements, de soins et de pensions sont nécessaires. La population change par les naissances et les décès, et par les personnes qui s'installent en Belgique ou la quittent. Vous voyez ici les deux.
    bevoegd: Les chiffres de population proviennent du Registre national. La politique migratoire est fédérale ; l'intégration relève des communautés.
  veiligheid_justitie:
    nl: Sécurité et justice
    vraag: Où en est la justice ?
    intro: La justice doit rendre des jugements et faire exécuter les peines. Vous voyez ici combien de personnes sont en prison et à quel point les prisons sont pleines.
    bevoegd: 'La justice, les tribunaux et les prisons sont fédéraux. La police travaille à deux niveaux : la police fédérale et la police locale. Les maisons de justice et l''aide aux détenus relèvent des communautés.'
begrippen:
  bbp:
    term: PIB
    uitleg: 'Le produit intérieur brut : la valeur de tout ce qu''un pays produit en un an. C''est la mesure habituelle de la taille d''une économie.'
  reeel:
    term: Croissance réelle
    uitleg: Une croissance dont on a retiré l'effet de la hausse des prix. On voit ainsi si nous produisons vraiment plus, et pas seulement plus cher.
  inflatie:
    term: Inflation
    uitleg: La hausse moyenne, sur un an, des prix de ce que les ménages achètent.
  procent_bbp:
    term: En pourcentage du PIB
    uitleg: Un montant comparé à la taille de l'économie. Cela permet de comparer équitablement des pays de tailles différentes.
  voorlopig:
    term: Provisoire
    uitleg: Un premier chiffre que la source peut encore réviser. Nous montrons toujours la version la plus récente et gardons la trace des révisions.
  werkzaamheidsgraad:
    term: Taux d'emploi
    uitleg: La part des personnes de 20 à 64 ans qui travaillent. Les personnes à temps partiel comptent aussi.
  werkloosheidsgraad:
    term: Taux de chômage
    uitleg: La part des chômeurs parmi les personnes qui travaillent ou cherchent activement un emploi. Celles qui ne cherchent pas, comme les étudiants, ne comptent pas.
  hoger_onderwijs:
    term: Enseignement supérieur
    uitleg: Un diplôme de bachelier ou de master, ou une formation équivalente après l'enseignement secondaire.
  arope:
    term: Pauvreté ou exclusion sociale
    uitleg: Les personnes qui ont un faible revenu, qui ne peuvent pas se permettre des choses de base (comme allumer le chauffage), ou qui vivent dans un ménage où presque personne ne travaille.
  co2_equivalent:
    term: Équivalent CO₂
    uitleg: Tous les gaz à effet de serre convertis en la quantité de CO₂ qui provoquerait le même réchauffement.
  gwh:
    term: Gigawattheure (GWh)
    uitleg: 'Une mesure d''une quantité d''électricité : un million de kilowattheures.'
  stiptheid:
    term: Ponctualité
    uitleg: Un train est ponctuel s'il arrive à sa destination finale avec moins de 6 minutes de retard. Les trains supprimés ne sont pas comptés dans ce chiffre.
  vergrijzing:
    term: Vieillissement
    uitleg: La part des personnes âgées dans la population augmente, parce que nous vivons plus longtemps et que moins d'enfants naissent.
