    uitleg: Vivre longtemps est une chose, vivre en bonne santé en est une autre. La différence avec l'espérance de vie, ce sont les années que nous vivons en moyenne avec des limitations. Le chiffre repose sur ce que les personnes répondent elles-mêmes dans une enquête.
