  pisa_lezen:
    titel: Faibles en lecture (PISA)
    vraag: Combien de jeunes de 15 ans n'atteignent pas le niveau de base en lecture ?
    definitie: Part des jeunes de 15 ans qui obtiennent un score inférieur au niveau 2 en compréhension de l'écrit dans le test PISA de l'OCDE.
    uitleg: Ceux qui restent sous le niveau 2 ont du mal à retrouver l'idée principale d'un texte ordinaire. Comme pour les mathématiques, il s'agit de l'ensemble de la Belgique ; les résultats par communauté paraissent dans des rapports nationaux distincts.
    zoekwoorden:
    - pisa
    - lecture
    - compréhension
    - langue
    - élèves
    - ocde
  stroomprijs:
    titel: Prix de l'électricité
    vraag: Combien coûte un kilowattheure d'électricité pour un ménage ?
    definitie: Prix moyen pour les ménages consommant de 2 500 à 4 999 kWh par an, toutes taxes et prélèvements compris. Eurostat publie deux chiffres par an (par semestre) ; nous montrons la moyenne des deux.
    uitleg: Un ménage moyen consomme quelques milliers de kilowattheures par an. Le prix comprend l'énergie elle-même, les coûts de réseau, les taxes et la TVA. Votre propre contrat peut être nettement plus cher ou moins cher.
    zoekwoorden:
    - électricité
    - courant
    - prix de l'énergie
    - facture d'énergie
    - kwh
    - énergie
  gasprijs:
    titel: Prix du gaz naturel
    vraag: Combien coûte un kilowattheure de gaz pour un ménage ?
    definitie: Prix moyen pour les ménages consommant de 20 à 199 gigajoules par an, toutes taxes et prélèvements compris. Eurostat publie deux chiffres par an (par semestre) ; nous montrons la moyenne des deux.
    uitleg: Cette consommation correspond à un ménage qui se chauffe au gaz. Le gaz est moins cher que l'électricité par kilowattheure, mais il en faut beaucoup plus pour le chauffage. Votre propre contrat peut nettement différer.
    zoekwoorden:
    - gaz
    - gaz naturel
    - chauffage
    - prix de l'énergie
    - facture d'énergie
    - énergie
