    uitleg: Ceux qui restent sous le niveau 2 ont du mal à retrouver l'idée principale d'un texte ordinaire. Comme pour les mathématiques, il s'agit de l'ensemble de la Belgique ; les résultats par communauté paraissent dans des rapports nationaux distincts.
