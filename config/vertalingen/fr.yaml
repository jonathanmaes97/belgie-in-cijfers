    definitie: Décès avant 75 ans qui auraient pu être évités par la prévention ou par des soins rapides et de qualité, pour 100 000 habitants (standardisé selon l'âge).
    uitleg: Pensez au cancer du poumon dû au tabac, aux accidents de la route ou à une infection traitable. Ce chiffre dit quelque chose de la prévention et de la qualité des soins à la fois.
