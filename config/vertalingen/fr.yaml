  invaliditeit:
    titel: Malades de longue durée (invalidité)
    vraag: Combien de travailleurs et de chômeurs sont malades de longue durée ?
    definitie: 'Nombre de travailleurs salariés et de chômeurs en invalidité au 31 décembre : ils sont en incapacité de travail depuis plus d''un an et reçoivent une indemnité de la mutualité. Les indépendants et les fonctionnaires relevant d''un régime propre ne sont pas comptés.'
    uitleg: 'Il s''agit d''un nombre de personnes, pas d''un pourcentage. Selon l''INAMI, les troubles psychiques et les maladies des muscles et des articulations sont les groupes les plus importants. Les dernières années sont provisoires : l''INAMI peut encore les réviser. D''autres pays comptent les malades de longue durée autrement ; c''est pourquoi il n''y a pas de comparaison avec les voisins ici. Un chiffre comparable figure dans la carte suivante.'
    zoekwoorden:
    - malades de longue durée
