    definitie: Dépenses publiques de défense (fonction GF02 de la classification européenne COFOG), en pourcentage du PIB.
    uitleg: Les dépenses militaires, l'armée et l'aide militaire à d'autres pays. L'OTAN utilise sa propre définition, un peu plus large ; ses chiffres peuvent donc être un peu plus élevés.
    zoekwoorden:
