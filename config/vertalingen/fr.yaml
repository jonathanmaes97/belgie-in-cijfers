  invaliditeit_uitgaven:
    titel: Dépenses d'invalidité
    vraag: Combien dépensons-nous pour les personnes qui ne peuvent pas travailler à cause d'une maladie ou d'un handicap, par rapport aux voisins ?
    definitie: 'Prestations et aides pour les personnes qui, en raison d''une maladie ou d''un handicap, ne peuvent (partiellement) pas travailler ou ont besoin d''aide, en pourcentage du PIB. Classification européenne SESPROS, fonction « invalidité ».'
    uitleg: 'Chaque pays compte les malades de longue durée à sa manière : le nombre d''invalides ci-dessus ne peut donc pas être comparé à d''autres pays. Ce chiffre-ci bien : Eurostat classe les dépenses de tous les pays de la même manière. Il contient plus que l''indemnité d''invalidité de la mutualité, par exemple aussi les allocations aux personnes handicapées.'
    zoekwoorden:
    - malade de longue durée
    - invalidité
    - handicap
    - incapacité de travail
