  pensioenuitgaven:
    titel: Dépenses de pensions
    vraag: Combien dépensons-nous pour les pensions ?
    definitie: Toutes les dépenses de pensions (pensions de retraite, anticipées, d'invalidité et de survie), en pourcentage du PIB (classification européenne SESPROS).
    uitleg: Les pensions sont le premier poste de dépenses de la sécurité sociale. Comme nous vivons plus longtemps et qu'il y a plus de personnes âgées, ce chiffre augmente si rien ne change. Il ne dit rien du montant d'une pension individuelle.
