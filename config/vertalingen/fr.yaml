snel:
  consumentenvertrouwen:
    titel: Confiance des consommateurs
    vraag: Les ménages sont-ils optimistes ?
    uitleg: 'Une enquête mensuelle auprès des ménages sur l''économie, le chômage, leurs propres finances et l''épargne. Zéro est neutre : un chiffre négatif signifie plus de pessimistes que d''optimistes.'
  conjunctuurbarometer:
    titel: Baromètre de conjoncture
    vraag: Comment les entreprises voient-elles la situation ?
    uitleg: 'Le baromètre de la Banque nationale résume les enquêtes mensuelles auprès des entreprises (industrie, construction, commerce et services). Il sert surtout à voir la direction : s''il monte, les entreprises sont plus positives.'
  werkloosheid_maand:
    titel: Chômage ce mois-ci
    vraag: Combien de personnes cherchent un emploi en ce moment ?
    uitleg: Taux de chômage selon la définition internationale, corrigé des variations saisonnières, pour pouvoir comparer les mois entre eux.
    vergelijk: UE
  bbp_kwartaal:
    titel: Croissance ce trimestre
    vraag: L'économie croît-elle en ce moment ?
    uitleg: Croissance du PIB (hors inflation) par rapport au trimestre précédent, corrigée des effets saisonniers et de calendrier. Deux trimestres de contraction consécutifs sont souvent appelés une récession.
  mazout:
    titel: Prix du mazout
    vraag: Combien coûte un litre de mazout ?
    uitleg: Le prix moyen du gasoil de chauffage, toutes taxes comprises, tel que la Belgique le communique chaque semaine à la Commission européenne. La Commission donne le prix pour 1 000 litres ; nous divisons par 1 000. Ce que vous payez dépend aussi de la quantité et de votre fournisseur.
    vergelijk: UE
    bron: Commission européenne (Weekly Oil Bulletin)
