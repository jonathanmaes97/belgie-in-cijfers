indicatoren:
  bbp_groei:
    titel: Croissance économique
    vraag: De combien l'économie croît-elle chaque année ?
    definitie: Croissance annuelle du produit intérieur brut, après correction de l'inflation.
    uitleg: Un chiffre positif signifie que nous avons produit ensemble plus que l'année précédente. Un chiffre négatif, comme pendant l'année du coronavirus 2020, signifie une contraction.
    zoekwoorden:
    - croissance
    - récession
    - économie
    - pib
  bbp_per_inwoner:
    titel: PIB par habitant
    vraag: Combien produisons-nous par personne ?
    definitie: Produit intérieur brut divisé par le nombre d'habitants, à prix courants.
    uitleg: Une mesure de la prospérité d'un pays. Ce n'est pas un revenu que chacun reçoit, mais la production totale divisée par le nombre d'habitants.
    zoekwoorden:
    - prospérité
    - richesse
    - revenu
  inflatie:
    titel: Inflation
    vraag: De combien la vie devient-elle plus chère ?
    definitie: Hausse annuelle moyenne des prix à la consommation (indice harmonisé, IPCH).
    uitleg: Avec une inflation de 3 %, ce qui coûtait 100 euros l'an dernier coûte maintenant en moyenne 103 euros. En Belgique, beaucoup de salaires et d'allocations suivent automatiquement (l'indexation).
    zoekwoorden:
    - prix
    - indice
    - indexation
    - vie chère
    - pouvoir d'achat
  schuld_per_inwoner:
    titel: Dette par habitant
    vraag: Quelle est la dette publique par habitant ?
    definitie: Dette publique divisée par le nombre d'habitants au 1er janvier de la même année.
    uitleg: Ce n'est pas un montant que vous devez payer vous-même. Il montre l'ampleur de la dette publique totale si on la répartissait entre tous les habitants.
    zoekwoorden:
    - dette publique
    - dette
    - emprunt
  overheidsschuld:
    titel: Dette publique
    vraag: Quelle est la taille de la dette publique par rapport à l'économie ?
    definitie: Dette brute consolidée de l'ensemble des pouvoirs publics, en pourcentage du PIB.
    uitleg: À 100 %, la dette est aussi grande que tout ce que le pays produit en un an. Les règles européennes demandent une dette de 60 % au maximum.
    norm: Norme européenne 60 %
    zoekwoorden:
    - dette publique
    - taux d'endettement
    - maastricht
  begrotingssaldo:
    titel: Solde budgétaire
    vraag: L'État dépense-t-il plus qu'il ne reçoit ?
    definitie: Excédent (+) ou déficit (−) de l'ensemble des pouvoirs publics, en pourcentage du PIB.
    uitleg: 'Un chiffre négatif est un déficit : l''État a dépensé plus qu''il n''a reçu et a dû emprunter. Les règles européennes demandent un déficit de 3 % au maximum.'
    norm: Norme européenne −3 %
    zoekwoorden:
    - déficit
    - budget
    - excédent
  rente_per_dag:
    titel: Intérêts par jour
    vraag: Combien d'intérêts l'État paie-t-il par jour ?
    definitie: Charges d'intérêts annuelles des pouvoirs publics divisées par 365, en millions d'euros.
    uitleg: Les intérêts sont le prix que l'État paie pour emprunter de l'argent. Cet argent ne peut pas servir à d'autres dépenses.
    zoekwoorden:
    - intérêts
    - charges d'intérêts
  rentelasten:
    titel: Charges d'intérêts
    vraag: Combien d'intérêts payons-nous par rapport à l'économie ?
    definitie: Intérêts que les pouvoirs publics paient sur leur dette, en pourcentage du PIB.
    uitleg: Cela permet de comparer la charge d'intérêts de pays de tailles différentes.
    zoekwoorden:
    - intérêts
  belastingdruk:
    titel: Pression fiscale
    vraag: Combien d'impôts et de cotisations payons-nous ensemble ?
    definitie: Ensemble des impôts et cotisations sociales, en pourcentage du PIB.
    uitleg: Tous les impôts (sur les revenus, la consommation, le patrimoine) et les cotisations sociales réunis, comparés à la taille de l'économie. Cela ne dit rien de ce que paie une personne.
    zoekwoorden:
    - impôts
    - taxes
    - fiscalité
    - onss
  belastingwig:
    titel: Charge fiscale sur un salaire plus bas
    vraag: Quelle part de ce que paie un employeur va aux impôts et cotisations ?
    definitie: 'Coin fiscal : impôt des personnes physiques plus cotisations sociales du travailleur et de l''employeur, en pourcentage du coût salarial total. Pour une personne isolée sans enfants qui gagne 67 % du salaire moyen (c''est ainsi qu''Eurostat définit cette série).'
    uitleg: 'Supposons qu''un employeur dépense 100 euros pour votre salaire. Ce chiffre indique quelle part va à l''État et à la sécurité sociale, y compris votre propre impôt des personnes physiques. Le reste, vous le recevez en net. Il s''agit d''une personne type : isolée, sans enfants, avec un salaire égal aux deux tiers du salaire moyen. Pour des salaires plus élevés, la charge est plus haute ; pour les salaires les plus bas, plus faible.'
    wafel_tekst: euros de coût salarial vont aux impôts et cotisations sociales (isolé, salaire plus bas)
    zoekwoorden:
    - impôts
    - salaire
    - net
    - brut
    - onss
    - coût salarial
    - coin fiscal
    - impôt des personnes physiques
  werkzaamheidsgraad:
    titel: Taux d'emploi
    vraag: Combien d'adultes ont un emploi ?
    definitie: Part des 20-64 ans qui ont un emploi.
    uitleg: Les étudiants, les retraités de moins de 65 ans, les malades de longue durée et les demandeurs d'emploi ne travaillent pas et font baisser ce chiffre. La Belgique vise 80 % d'ici 2030.
    norm: Objectif belge pour 2030 80 %
    zoekwoorden:
    - emplois
    - emploi
    - mise à l'emploi
    - 80 pour cent
  werkloosheid:
    titel: Chômage
    vraag: Combien de personnes cherchent un emploi ?
    definitie: Part des chômeurs dans la population active de 15 à 74 ans (définition internationale).
    uitleg: 'Selon la définition internationale : les personnes sans emploi qui cherchent activement et peuvent commencer rapidement. Ce n''est pas la même chose que le nombre de personnes qui touchent une allocation de chômage.'
    zoekwoorden:
    - chômeurs
    - demandeurs d'emploi
    - forem
    - actiris
    - vdab
  levensverwachting:
    titel: Espérance de vie
    vraag: Jusqu'à quel âge vivons-nous en moyenne ?
    definitie: Nombre moyen d'années qu'un nouveau-né vivra selon les taux de mortalité de l'année.
    uitleg: Combien de temps un bébé né cette année vivra en moyenne, si la santé de la population reste comme aujourd'hui.
    zoekwoorden:
    - âge
    - mortalité
    - santé
  zorguitgaven:
    titel: Dépenses de santé
    vraag: Combien dépensons-nous pour les soins de santé ?
    definitie: Dépenses totales de santé, publiques et privées, en pourcentage du PIB.
    uitleg: Ce que l'État, les mutualités, les assureurs et les patients eux-mêmes dépensent ensemble pour les soins.
    zoekwoorden:
    - soins
    - hôpital
    - inami
    - mutualité
  diploma_hoger_onderwijs:
    titel: Diplôme de l'enseignement supérieur
    vraag: Combien de jeunes adultes ont un diplôme de l'enseignement supérieur ?
    definitie: Part des 25-34 ans titulaires d'un diplôme de l'enseignement supérieur.
    uitleg: Il s'agit des personnes de 25 à 34 ans titulaires d'un bachelier, d'un master ou d'un diplôme équivalent.
    wafel_tekst: personnes de 25 à 34 ans ont un diplôme de l'enseignement supérieur
    zoekwoorden:
    - haute école
    - université
    - diplôme
    - études
  vroegtijdige_schoolverlaters:
    titel: Décrochage scolaire
    vraag: Combien de jeunes quittent l'école sans diplôme ?
    definitie: Part des 18-24 ans sans diplôme de l'enseignement secondaire qui ne suivent plus de formation.
    uitleg: Les jeunes sans diplôme de l'enseignement secondaire ont souvent plus de difficultés sur le marché du travail.
    wafel_tekst: jeunes de 18 à 24 ans n'ont pas de diplôme du secondaire et ne suivent plus de formation
    zoekwoorden:
    - décrochage
    - sans qualification
    - école
    - diplôme
  armoede_uitsluiting:
    titel: Risque de pauvreté
    vraag: Combien de personnes sont menacées de pauvreté ?
    definitie: Part de la population à faible revenu, en situation de privation matérielle grave ou à très faible intensité de travail (AROPE).
    uitleg: C'est la mesure européenne. Vous êtes compté si vous avez un faible revenu, si vous ne pouvez pas vous permettre des choses de base, ou si vous vivez dans un ménage où presque personne ne travaille.
    wafel_tekst: habitants sont menacés de pauvreté ou d'exclusion sociale
    zoekwoorden:
    - pauvreté
    - pauvre
    - joindre les deux bouts
    - exclusion
    - arope
  woningprijzen:
    titel: Prix des logements
    vraag: De combien les logements deviennent-ils plus chers chaque année ?
    definitie: Hausse annuelle des prix des logements (indice des prix des logements).
    uitleg: De combien le prix d'un logement augmente ou baisse en moyenne par rapport à l'année précédente, logements neufs et existants confondus.
    zoekwoorden:
    - maison
    - prix immobilier
    - immobilier
    - acheter
  hernieuwbare_energie:
    titel: Énergie renouvelable
    vraag: Quelle part de notre énergie provient de sources renouvelables ?
    definitie: Part des sources renouvelables dans la consommation finale brute d'énergie.
    uitleg: 'Il s''agit de toute l''énergie : l''électricité, mais aussi le chauffage et le transport. Le soleil, le vent, la biomasse et l''hydraulique comptent comme renouvelables.'
    zoekwoorden:
    - panneaux solaires
    - éoliennes
    - électricité verte
    - énergie
  uitstoot_per_inwoner:
    titel: Émissions par habitant
    vraag: Combien de gaz à effet de serre émettons-nous par personne ?
    definitie: Émissions nettes de gaz à effet de serre par habitant, en tonnes d'équivalent CO₂.
    uitleg: Les émissions de tout le pays (transport, industrie, chauffage, agriculture) divisées par le nombre d'habitants. Les forêts qui absorbent du CO₂ sont déduites.
    zoekwoorden:
    - co2
    - climat
    - émissions
    - gaz à effet de serre
  kernenergie_aandeel:
    titel: Le nucléaire dans notre électricité
    vraag: Quelle part de notre électricité provient des centrales nucléaires ?
    definitie: Part du nucléaire dans la production brute d'électricité du pays.
    uitleg: Il s'agit uniquement de l'électricité, pas de toute l'énergie. En fonctionnement, les centrales nucléaires n'émettent pratiquement pas de gaz à effet de serre, mais le nucléaire ne compte pas comme énergie renouvelable. L'électricité importée de l'étranger n'est pas incluse dans ce chiffre.
    zoekwoorden:
    - nucléaire
    - centrale nucléaire
    - doel
    - tihange
    - électricité
    - courant
  treinstiptheid:
    titel: Ponctualité des trains
    vraag: Combien de trains arrivent à l'heure ?
    definitie: Part des trains de voyageurs intérieurs arrivant à destination finale avec moins de 6 minutes de retard, par an (tous les mois confondus).
    uitleg: Un train avec 6 minutes de retard ou plus compte comme en retard. Les trains supprimés ne sont pas comptés dans ce chiffre. Pour l'année en cours, il s'agit des mois écoulés jusqu'à présent.
    wafel_tekst: trains sont arrivés à l'heure
    zoekwoorden:
    - train
    - sncb
    - infrabel
    - retard
    - rail
  verkeersdoden:
    titel: Tués sur les routes
    vraag: Combien de personnes meurent sur les routes ?
    definitie: Nombre de personnes décédées dans les 30 jours suivant un accident de la route, par million d'habitants.
    uitleg: Par million d'habitants, pour pouvoir comparer des pays de tailles différentes.
    zoekwoorden:
    - accidents
    - sécurité routière
    - voiture
    - vélo
  bevolking:
    titel: Habitants
    vraag: Combien de personnes vivent en Belgique ?
    definitie: Nombre d'habitants au 1er janvier.
    uitleg: Toutes les personnes qui résident officiellement en Belgique, inscrites au Registre national.
    zoekwoorden:
    - habitants
    - population
    - personnes
  aandeel_65plus:
    titel: Les 65 ans et plus
    vraag: Combien d'habitants ont 65 ans ou plus ?
    definitie: Part de la population âgée de 65 ans ou plus.
    uitleg: Plus cette part est grande, plus il faut de moyens pour les pensions et les soins, et moins il y a de personnes en âge de travailler pour les financer.
    wafel_tekst: habitants ont 65 ans ou plus
    zoekwoorden:
    - personnes âgées
    - vieillissement
    - pension
    - seniors
  netto_migratie:
    titel: Migration nette
    vraag: Combien de personnes s'ajoutent en net par la migration ?
    definitie: Nombre de personnes qui s'installent dans le pays moins le nombre de celles qui le quittent, pour 1 000 habitants (y compris ajustement statistique).
    uitleg: Il s'agit de toutes les personnes qui déménagent, y compris les Belges qui partent à l'étranger ou qui reviennent. Un chiffre positif signifie que plus de personnes viennent s'installer qu'il n'en part.
    zoekwoorden:
    - migration
    - immigration
    - émigration
    - migrants
    - déménager
  natuurlijke_aangroei:
    titel: Accroissement naturel
    vraag: Naît-il plus de personnes qu'il n'en meurt ?
    definitie: Nombre de naissances moins le nombre de décès, pour 1 000 habitants.
    uitleg: Avec la migration nette, ce chiffre détermine si la population augmente. Un chiffre négatif signifie qu'il y a plus de décès que de naissances.
    zoekwoorden:
    - naissances
    - décès
    - mortalité
    - bébés
    - accroissement
  geboren_buitenland:
    titel: Nés à l'étranger
    vraag: Combien d'habitants sont nés à l'étranger ?
    definitie: Part des habitants nés hors du pays, quelle que soit leur nationalité.
    uitleg: 'Le pays de naissance ne dit rien de la nationalité : les Belges nés à l''étranger sont aussi comptés, et les enfants de migrants nés ici ne le sont pas.'
    wafel_tekst: habitants sont nés à l'étranger
    zoekwoorden:
    - migration
    - migrants
    - étranger
    - origine
    - primo-arrivants
  asielaanvragen:
    titel: Premières demandes d'asile
    vraag: Combien de personnes demandent l'asile pour la première fois ?
    definitie: Nombre de personnes qui introduisent pour la première fois cette année-là une demande de protection internationale.
    uitleg: 'Une demande d''asile n''est pas encore une reconnaissance : une partie des demandes est refusée. Seules les premières demandes sont comptées ici, pas les demandes répétées.'
    zoekwoorden:
    - asile
    - réfugiés
    - demandeurs d'asile
    - accueil
    - protection
  pisa_wiskunde:
    titel: Faibles en mathématiques (PISA)
    vraag: Combien de jeunes de 15 ans n'atteignent pas le niveau de base en mathématiques ?
    definitie: Part des jeunes de 15 ans qui obtiennent un score inférieur au niveau 2 en mathématiques dans le test PISA de l'OCDE.
    uitleg: PISA est un test international passé régulièrement par les jeunes de 15 ans. Ceux qui restent sous le niveau 2 ont du mal avec des applications simples, comme comparer des prix ou lire un graphique simple. L'enseignement relève des communautés ; Eurostat ne publie que le chiffre pour l'ensemble de la Belgique.
    wafel_tekst: jeunes de 15 ans n'atteignent pas le niveau de base en mathématiques
