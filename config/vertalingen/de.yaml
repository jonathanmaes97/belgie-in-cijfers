snel:
  consumentenvertrouwen:
    titel: Verbrauchervertrauen
    vraag: Wie optimistisch sind die Haushalte?
    uitleg: 'Eine monatliche Umfrage bei Haushalten zu Wirtschaft, Arbeitslosigkeit, eigenen Finanzen und Sparen. Null ist neutral: Eine negative Zahl bedeutet mehr Pessimisten als Optimisten.'
  conjunctuurbarometer:
    titel: Konjunkturbarometer
    vraag: Wie sehen es die Unternehmen?
    uitleg: 'Das Barometer der Nationalbank fasst die monatlichen Umfragen bei Unternehmen zusammen (Industrie, Bau, Handel und Dienstleistungen). Es dient vor allem dazu, die Richtung zu erkennen: Steigt es, sind die Unternehmen positiver.'
  werkloosheid_maand:
    titel: Arbeitslosigkeit diesen Monat
    vraag: Wie viele Menschen suchen jetzt Arbeit?
    uitleg: Arbeitslosenquote nach internationaler Definition, saisonbereinigt, damit man Monate miteinander vergleichen kann.
    vergelijk: EU
  bbp_kwartaal:
    titel: Wachstum in diesem Quartal
    vraag: Wächst die Wirtschaft gerade?
    uitleg: Wachstum des BIP (nach Inflation) gegenüber dem Vorquartal, saison- und kalenderbereinigt. Zwei Quartale Rückgang hintereinander nennt man oft eine Rezession.
  mazout:
    titel: Heizölpreis
    vraag: Was kostet ein Liter Heizöl?
    uitleg: Der Durchschnittspreis für Heizöl, einschließlich aller Steuern, wie Belgien ihn jede Woche der Europäischen Kommission meldet. Die Kommission gibt den Preis pro 1.000 Liter an; wir teilen durch 1.000. Was Sie selbst zahlen, hängt auch von der Menge und Ihrem Lieferanten ab.
    vergelijk: EU
    bron: Europäische Kommission (Weekly Oil Bulletin)
