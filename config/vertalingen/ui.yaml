    fr: "Une question, une idée ou une erreur ? Écrivez à <a href=\"mailto:{mail}\">{mail}</a>."
    de: "Frage, Idee oder Fehler entdeckt? Schreiben Sie an <a href=\"mailto:{mail}\">{mail}</a>."
    en: "Question, idea or spotted a mistake? Email <a href=\"mailto:{mail}\">{mail}</a>."
  voet_onafhankelijk:
    nl: "Deze site is onafhankelijk en niet verbonden aan de instellingen die de cijfers publiceren. De uitleg, de vertalingen en de afgeleide cijfers (zoals schuld per inwoner) zijn van deze site; zij zijn niet verantwoordelijk voor hoe hun cijfers hier worden voorgesteld."
    fr: "Ce site est indépendant et n'est pas lié aux institutions qui publient les chiffres. Les explications, les traductions et les chiffres dérivés (comme la dette par habitant) sont de ce site ; ces institutions ne sont pas responsables de la manière dont leurs chiffres sont présentés ici."
    de: "Diese Website ist unabhängig und nicht mit den Institutionen verbunden, die die Zahlen veröffentlichen. Erläuterungen, Übersetzungen und abgeleitete Zahlen (wie Schulden pro Einwohner) stammen von dieser Website; die Institutionen sind nicht dafür verantwortlich, wie ihre Zahlen hier dargestellt werden."
    en: "This site is independent and not affiliated with the institutions that publish the figures. The explanations, translations and derived figures (such as debt per inhabitant) are this site's own; those institutions are not responsible for how their figures are presented here."
  voet_vibe:
    nl: "Met <button type=\"button\" class=\"hartje\" aria-label=\"liefde\">♥</button> gevibecodet: deze site is gebouwd met hulp van AI (Claude). De cijfers zelf komen rechtstreeks uit de officiële bronnen, zonder dat er AI aan te pas komt."
    fr: "Vibecodé avec <button type=\"button\" class=\"hartje\" aria-label=\"amour\">♥</button> : ce site a été construit avec l'aide de l'IA (Claude). Les chiffres eux-mêmes proviennent directement des sources officielles, sans intervention de l'IA."
    de: "Mit <button type=\"button\" class=\"hartje\" aria-label=\"Liebe\">♥</button> gevibecodet: Diese Website wurde mit Hilfe von KI (Claude) gebaut. Die Zahlen selbst stammen direkt aus den offiziellen Quellen, ohne KI."
    en: "Vibe-coded with <button type=\"button\" class=\"hartje\" aria-label=\"love\">♥</button>: this site was built with the help of AI (Claude). The figures themselves come straight from the official sources, with no AI involved."

