    fr: "Domaine"
    de: "Bereich"
    en: "Area"
  uit_per_100:
    nl: "Per 100 euro"
    fr: "Pour 100 euros"
    de: "Pro 100 Euro"
    en: "Per 100 euros"
  uit_per_inwoner:
    nl: "Per inwoner per jaar"
    fr: "Par habitant et par an"
    de: "Pro Einwohner und Jahr"
    en: "Per inhabitant per year"
  uit_uitleg:
    nl: "Het gaat om alle uitgaven van de federale overheid, de gemeenschappen, de gewesten, de gemeenten en de sociale zekerheid samen. Ze worden betaald met belastingen, sociale bijdragen en leningen. \"Per inwoner\" is het totale bedrag gedeeld door het aantal inwoners: het is geen bedrag dat je zelf betaalt."
    fr: "Il s'agit de toutes les dépenses de l'État fédéral, des communautés, des régions, des communes et de la sécurité sociale réunies. Elles sont financées par les impôts, les cotisations sociales et l'emprunt. « Par habitant » est le montant total divisé par le nombre d'habitants : ce n'est pas un montant que vous payez vous-même."
    de: "Es geht um alle Ausgaben des Föderalstaats, der Gemeinschaften, der Regionen, der Gemeinden und der sozialen Sicherheit zusammen. Sie werden mit Steuern, Sozialbeiträgen und Krediten bezahlt. „Pro Einwohner“ ist der Gesamtbetrag geteilt durch die Zahl der Einwohner: Es ist kein Betrag, den Sie selbst zahlen."
    en: "This covers all spending by the federal government, the communities, the regions, the municipalities and social security together. It is paid for by taxes, social contributions and borrowing. \"Per inhabitant\" is the total divided by the number of inhabitants: it is not an amount you pay yourself."
  uit_bron_noot:
    nl: "(indeling COFOG) · per inwoner berekend met de bevolking op 1 januari {jaar}"
    fr: "(classification COFOG) · par habitant calculé avec la population au 1er janvier {jaar}"
    de: "(COFOG-Klassifikation) · pro Einwohner berechnet mit der Bevölkerung am 1. Januar {jaar}"
    en: "(COFOG classification) · per inhabitant calculated using the population on 1 January {jaar}"

  # ---- regeringen en themapagina
  reg_schakelaar:
    nl: "Toon de federale regeringen op de grafieken"
    fr: "Afficher les gouvernements fédéraux sur les graphiques"
    de: "Föderalregierungen in den Diagrammen anzeigen"
    en: "Show the federal governments on the charts"
  reg_uitleg:
    nl: "Een regering is nooit de enige oorzaak van hoe een cijfer evolueert. Veel cijfers reageren pas jaren later op beleid, en ze hangen ook af van de wereldeconomie, Europese regels en het beleid van de deelstaten."
    fr: "Un gouvernement n'est jamais la seule cause de l'évolution d'un chiffre. Beaucoup de chiffres ne réagissent à une politique que des années plus tard, et ils dépendent aussi de l'économie mondiale, des règles européennes et des politiques des entités fédérées."
    de: "Eine Regierung ist nie die einzige Ursache dafür, wie sich eine Zahl entwickelt. Viele Zahlen reagieren erst Jahre später auf Politik, und sie hängen auch von der Weltwirtschaft, europäischen Regeln und der Politik der Gliedstaaten ab."
    en: "A government is never the only cause of how a figure develops. Many figures only respond to policy years later, and they also depend on the world economy, European rules and the policies of the regions and communities."
