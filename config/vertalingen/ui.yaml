    en: "and"
  uit_officieel:
    nl: "bij Eurostat"
    fr: "chez Eurostat"
    de: "bei Eurostat"
    en: "at Eurostat"
  uit_controleer:
    nl: "controleer"
    fr: "vérifier"
    de: "prüfen"
    en: "check"
  uit_zo_vind:
    nl: "Zo vind je deze cijfers zelf bij Eurostat: open de dataset {ds}, kies België en daarna deze filters: {filters}. De functies (cofog99) staan onder hun Engelse naam, die je bij elk domein hierboven ziet. Of klik bij een domein op \"controleer\" voor de exacte bevraging."
    fr: "Pour retrouver ces chiffres vous-même chez Eurostat : ouvrez le jeu de données {ds}, choisissez la Belgique puis ces filtres : {filters}. Les fonctions (cofog99) y figurent sous leur nom anglais, indiqué pour chaque domaine ci-dessus. Ou cliquez sur « vérifier » à côté d'un domaine pour la requête exacte."
    de: "So finden Sie diese Zahlen selbst bei Eurostat: Öffnen Sie den Datensatz {ds}, wählen Sie Belgien und dann diese Filter: {filters}. Die Aufgabenbereiche (cofog99) stehen dort unter ihrem englischen Namen, den Sie oben bei jedem Bereich sehen. Oder klicken Sie bei einem Bereich auf „prüfen“ für die genaue Abfrage."
    en: "To find these figures yourself at Eurostat: open the dataset {ds}, choose Belgium and then these filters: {filters}. The functions (cofog99) are listed under their English names, shown for each area above. Or click \"check\" next to an area for the exact query."
  uit_per_inwoner_noot:
    nl: "Per inwoner: het bedrag in miljoen euro (zelfde dataset, eenheid MIO_EUR) gedeeld door het aantal inwoners op 1 januari {jaar} (Eurostat)."
    fr: "Par habitant : le montant en millions d'euros (même jeu de données, unité MIO_EUR) divisé par le nombre d'habitants au 1er janvier {jaar} (Eurostat)."
    de: "Pro Einwohner: der Betrag in Millionen Euro (gleicher Datensatz, Einheit MIO_EUR) geteilt durch die Zahl der Einwohner am 1. Januar {jaar} (Eurostat)."
    en: "Per inhabitant: the amount in millions of euros (same dataset, unit MIO_EUR) divided by the number of inhabitants on 1 January {jaar} (Eurostat)."
  rk_loonbrief:
    nl: "Op je loonbrief staat elke maand een ander bedrag. Je werkgever houdt bedrijfsvoorheffing in: een voorschot op je belasting, dat met je aanslagbiljet wordt verrekend. Deze rekenmodule toont de eindafrekening over het hele jaar."
    fr: "Votre fiche de paie affiche un autre montant chaque mois. Votre employeur retient un précompte professionnel : une avance sur votre impôt, régularisée avec votre avertissement-extrait de rôle. Ce simulateur montre le décompte final sur toute l'année."
    de: "Auf Ihrer Lohnabrechnung steht jeden Monat ein anderer Betrag. Ihr Arbeitgeber behält einen Berufssteuervorabzug ein: einen Vorschuss auf Ihre Steuer, der mit Ihrem Steuerbescheid verrechnet wird. Dieser Rechner zeigt die Endabrechnung für das ganze Jahr."
    en: "Your payslip shows a different amount each month. Your employer withholds advance tax (bedrijfsvoorheffing): a prepayment on your tax that is settled with your tax assessment. This calculator shows the final settlement for the whole year."

