    en: "All code and data are public on <a href=\"{repo}\">GitHub</a>. Sources sometimes revise their figures: see the <a href=\"{repo}/blob/main/data/changelog.json\">revisions</a> and the <a href=\"{repo}/blob/main/reports/status.md\">status of each source</a>."
