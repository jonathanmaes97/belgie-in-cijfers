  # ---- uitgaven
  uit_label:
    nl: "Overheidsuitgaven per functie"
    fr: "Dépenses publiques par fonction"
    de: "Staatsausgaben nach Aufgabenbereichen"
    en: "Government spending by function"
  uit_titel:
    nl: "Waar gaat ons belastinggeld naartoe?"
    fr: "Où va l'argent de nos impôts ?"
    de: "Wohin fließt unser Steuergeld?"
    en: "Where does our tax money go?"
  uit_intro:
    nl: "Van elke 100 euro die alle Belgische overheden samen in {jaar} uitgaven, ging zoveel naar elk domein."
    fr: "Sur chaque tranche de 100 euros dépensée par l'ensemble des pouvoirs publics belges en {jaar}, voici ce qui est allé à chaque domaine."
    de: "Von jeden 100 Euro, die alle belgischen Behörden zusammen {jaar} ausgegeben haben, ging so viel in jeden Bereich."
    en: "Of every 100 euros spent by all Belgian governments together in {jaar}, this is how much went to each area."
  uit_totaal:
    nl: " Samen is dat {bedrag} per inwoner."
    fr: " Au total, cela représente {bedrag} par habitant."
    de: " Zusammen sind das {bedrag} pro Einwohner."
    en: " Together that is {bedrag} per inhabitant."
  uit_aria:
    nl: "Verdeling van 100 euro overheidsuitgaven"
    fr: "Répartition de 100 euros de dépenses publiques"
    de: "Aufteilung von 100 Euro Staatsausgaben"
    en: "Breakdown of 100 euros of government spending"
  uit_domein:
