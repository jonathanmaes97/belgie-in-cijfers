    nl: "; daarna {lijst}"
    fr: " ; ensuite {lijst}"
    de: "; danach {lijst}"
    en: "; then {lijst}"
  vz_uitleg:
    nl: "Wanneer de spilindex wordt overschreden, stijgen de sociale uitkeringen en de wedden van ambtenaren met 2%. Lonen in de privésector worden geïndexeerd volgens de regels van elke sector. De afgevlakte gezondheidsindex beslist wanneer dat gebeurt: zonder tabak, alcohol en brandstof, en uitgemiddeld over vier maanden."
    fr: "Lorsque l'indice-pivot est dépassé, les allocations sociales et les traitements des fonctionnaires augmentent de 2 %. Les salaires du secteur privé sont indexés selon les règles de chaque secteur. C'est l'indice santé lissé qui décide du moment : sans tabac, alcool ni carburant, et en moyenne sur quatre mois."
    de: "Wenn der Schwellenindex überschritten wird, steigen die Sozialleistungen und die Gehälter der Beamten um 2 %. Die Löhne in der Privatwirtschaft werden nach den Regeln des jeweiligen Sektors indexiert. Der geglättete Gesundheitsindex bestimmt den Zeitpunkt: ohne Tabak, Alkohol und Kraftstoff und gemittelt über vier Monate."
    en: "When the pivot index is exceeded, social benefits and civil servants' salaries rise by 2%. Private-sector wages are indexed according to the rules of each sector. The smoothed health index decides when this happens: it excludes tobacco, alcohol and fuel, and is averaged over four months."
  vz_grafiek_aria:
    nl: "Inflatie per maand, gemeten en verwacht"
    fr: "Inflation mensuelle, observée et prévue"
    de: "Monatliche Inflation, gemessen und erwartet"
    en: "Monthly inflation, observed and forecast"
  vz_andere:
