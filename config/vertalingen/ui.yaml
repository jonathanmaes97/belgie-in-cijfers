  csv_noot:
    nl: "handig om te hergebruiken; de bron zelf blijft de referentie"
    fr: "pratique pour la réutilisation ; la source elle-même reste la référence"
    de: "praktisch zur Weiterverwendung; maßgeblich bleibt die Quelle selbst"
    en: "handy for reuse; the source itself remains the reference"
  berekend_uit:
