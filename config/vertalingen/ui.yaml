    de: "Geben Sie Ihr Bruttogehalt ein. Sie sehen, wie viel an die soziale Sicherheit und an Steuern geht, wie viel Ihnen netto bleibt und wohin das Geld fließt. Eine Annäherung für Angestellte auf Grundlage der offiziellen Tarife für das Einkommensjahr {jaar}."
    en: "Enter your gross salary. You will see how much goes to social security and to taxes, how much you take home, and where that money goes. An approximation for white-collar employees, based on the official rates for income year {jaar}."
