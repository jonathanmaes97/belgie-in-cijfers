  vertrouwen_2:
    nl: "Een programma haalt de cijfers elke dag automatisch op. Niemand tikt ze over, en bij de cijfers zelf komt geen AI aan te pas."
    fr: "Un programme récupère les chiffres automatiquement chaque jour. Personne ne les recopie à la main, et aucune IA n'intervient dans les chiffres eux-mêmes."
    de: "Ein Programm ruft die Zahlen jeden Tag automatisch ab. Niemand tippt sie ab, und bei den Zahlen selbst ist keine KI im Spiel."
