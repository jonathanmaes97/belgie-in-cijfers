    nl: "Zo wordt het berekend"
    fr: "Comment c'est calculé"
    de: "So wird es berechnet"
    en: "How it is calculated"
  rk_schijven:
    nl: "Belasting per schijf"
    fr: "Impôt par tranche"
    de: "Steuer pro Stufe"
    en: "Tax per bracket"
  rk_schijven_uitleg:
    nl: "Je belastbaar inkomen wordt in schijven verdeeld. Elke schijf heeft haar eigen tarief: alleen het deel boven een grens wordt aan het hogere tarief belast."
    fr: "Votre revenu imposable est divisé en tranches. Chaque tranche a son propre taux : seule la partie au-dessus d'un seuil est imposée au taux supérieur."
    de: "Ihr steuerpflichtiges Einkommen wird in Stufen aufgeteilt. Jede Stufe hat ihren eigenen Satz: Nur der Teil oberhalb einer Grenze wird zum höheren Satz besteuert."
    en: "Your taxable income is split into brackets. Each bracket has its own rate: only the part above a threshold is taxed at the higher rate."
  rk_waarheen:
    nl: "Waar gaat jouw bijdrage naartoe?"
    fr: "Où va votre contribution ?"
    de: "Wohin fließt Ihr Beitrag?"
    en: "Where does your contribution go?"
  rk_waarheen_uitleg:
    nl: "Als je totale bijdrage verdeeld zou worden zoals alle Belgische overheidsuitgaven in <span id=\"r-waarheen-jaar\">…</span> (Eurostat). Dit is een illustratie: in werkelijkheid gaat je RSZ-bijdrage naar de sociale zekerheid en wordt het geld uit alle bronnen samen verdeeld."
    fr: "Si votre contribution totale était répartie comme l'ensemble des dépenses publiques belges en <span id=\"r-waarheen-jaar\">…</span> (Eurostat). C'est une illustration : en réalité, vos cotisations ONSS vont à la sécurité sociale et l'argent de toutes les sources est réparti ensemble."
    de: "Wenn Ihr gesamter Beitrag so verteilt würde wie alle belgischen Staatsausgaben im Jahr <span id=\"r-waarheen-jaar\">…</span> (Eurostat). Dies ist eine Veranschaulichung: In Wirklichkeit fließt Ihr LSS-Beitrag in die soziale Sicherheit, und das Geld aus allen Quellen wird gemeinsam verteilt."
    en: "If your total contribution were divided like all Belgian government spending in <span id=\"r-waarheen-jaar\">…</span> (Eurostat). This is an illustration: in reality your social security contribution goes to social security, and money from all sources is pooled."
  rk_niet:
    nl: "Wat zit er niet in?"
    fr: "Qu'est-ce qui n'est pas inclus ?"
    de: "Was ist nicht enthalten?"
    en: "What is not included?"
  rk_niet_uitleg:
    nl: "Deze rekenmodule is een benadering. Je echte loonbrief en aanslagbiljet kunnen afwijken, onder meer door:"
    fr: "Ce simulateur est une approximation. Votre fiche de paie et votre avertissement-extrait de rôle réels peuvent différer, notamment en raison de :"
    de: "Dieser Rechner ist eine Annäherung. Ihre tatsächliche Lohnabrechnung und Ihr Steuerbescheid können abweichen, unter anderem durch:"
    en: "This calculator is an approximation. Your actual payslip and tax assessment may differ, among other things because of:"
  rk_bronnen:
    nl: "Bronnen van alle bedragen"
    fr: "Sources de tous les montants"
    de: "Quellen aller Beträge"
    en: "Sources of all amounts"
  rk_officieel:
    nl: "Voor een officiële berekening: de simulator Tax-Calc van FOD Financiën."
    fr: "Pour un calcul officiel : le simulateur Tax-Calc du SPF Finances."
    de: "Für eine offizielle Berechnung: der Simulator Tax-Calc des FÖD Finanzen."
    en: "For an official calculation: the Tax-Calc simulator of the FPS Finance."
  rk_beschrijving:
    nl: "Van brutoloon naar netto: hoeveel gaat naar sociale zekerheid en belastingen, en waar gaat het naartoe?"
    fr: "Du brut au net : combien va à la sécurité sociale et aux impôts, et où cela va-t-il ?"
    de: "Von brutto zu netto: Wie viel geht an die soziale Sicherheit und an Steuern, und wohin fließt es?"
    en: "From gross to net: how much goes to social security and taxes, and where does it go?"

