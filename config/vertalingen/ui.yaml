  vz_andere_uitleg:
    nl: "Het Planbureau verzamelt de vooruitzichten van verschillende instellingen voor België. Ze verschillen omdat ze op een ander moment zijn gemaakt en van andere veronderstellingen uitgaan."
    fr: "Le Bureau du Plan rassemble les prévisions de différentes institutions pour la Belgique. Elles diffèrent parce qu'elles ont été établies à un autre moment et reposent sur d'autres hypothèses."
    de: "Das Planbüro sammelt die Prognosen verschiedener Institutionen für Belgien. Sie unterscheiden sich, weil sie zu einem anderen Zeitpunkt und mit anderen Annahmen erstellt wurden."
    en: "The Planning Bureau collects the forecasts of various institutions for Belgium. They differ because they were made at different times and use different assumptions."
