    fr: "Combien d'impôts est-ce que je paie ?"
    de: "Wie viel Steuern zahle ich?"
    en: "How much tax do I pay?"
  rk_intro:
    nl: "Vul je brutoloon in. Je ziet hoeveel er naar de sociale zekerheid en naar belastingen gaat, hoeveel je netto overhoudt, en waar dat geld naartoe gaat. Een benadering voor bedienden, op basis van de officiële tarieven voor inkomstenjaar {jaar}."
    fr: "Indiquez votre salaire brut. Vous verrez ce qui va à la sécurité sociale et aux impôts, ce qu'il vous reste en net, et où va cet argent. Une approximation pour les employés, sur la base des barèmes officiels des revenus {jaar}."
    de: "Geben Sie Ihr Bruttogehalt ein. Sie sehen, wie viel an die soziale Sicherheit und an Steuern geht, wie viel Ihnen netto bleibt und wohin das Geld fließt. Eine Annäherung für Angestellte auf Grundlage der offiziellen Tarife für das Einkommensjahr {jaar}."
    en: "Enter your gross salary. You will see how much goes to social security and to taxes, how much you take home, and where that money goes. An approximation for white-collar employees, based on the official rates for income year {jaar}."
