  # ---- gewestenpagina
  gw_kruimel:
    nl: "Per gewest"
    fr: "Par région"
    de: "Nach Region"
    en: "By region"
  gw_titel:
    nl: "Hoe verschillen Vlaanderen, Wallonië en Brussel?"
    fr: "En quoi la Flandre, la Wallonie et Bruxelles diffèrent-elles ?"
    de: "Wie unterscheiden sich Flandern, die Wallonie und Brüssel?"
    en: "How do Flanders, Wallonia and Brussels differ?"
  gw_intro:
    nl: "België heeft drie gewesten: het Vlaams, het Waals en het Brussels Hoofdstedelijk Gewest. Ze zijn onder meer bevoegd voor economie, werkbegeleiding, wonen, mobiliteit en milieu. Daarnaast zijn er drie gemeenschappen (Vlaams, Frans en Duitstalig) voor onder meer onderwijs, cultuur en welzijn."
    fr: "La Belgique compte trois régions : la Région flamande, la Région wallonne et la Région de Bruxelles-Capitale. Elles sont notamment compétentes pour l'économie, l'accompagnement des demandeurs d'emploi, le logement, la mobilité et l'environnement. Il existe aussi trois communautés (flamande, française et germanophone), compétentes notamment pour l'enseignement, la culture et l'aide aux personnes."
    de: "Belgien hat drei Regionen: die Flämische Region, die Wallonische Region und die Region Brüssel-Hauptstadt. Sie sind unter anderem für Wirtschaft, Arbeitsvermittlung, Wohnen, Mobilität und Umwelt zuständig. Daneben gibt es drei Gemeinschaften (Flämische, Französische und Deutschsprachige), zuständig unter anderem für Bildung, Kultur und Soziales."
    en: "Belgium has three regions: the Flemish Region, the Walloon Region and the Brussels-Capital Region. They are responsible for, among other things, the economy, job-seeker support, housing, mobility and the environment. There are also three communities (Flemish, French and German-speaking), responsible for education, culture and welfare, among other things."
  gw_goed_titel:
    nl: "Goed om te weten"
    fr: "Bon à savoir"
    de: "Gut zu wissen"
    en: "Good to know"
  gw_goed:
    nl: "De cijfers hieronder volgen het grondgebied van de gewesten. Wallonië omvat dus ook de Duitstalige Gemeenschap, en Brussel telt alle inwoners van de negentien Brusselse gemeenten, ook al vallen die onder twee gemeenschappen."
    fr: "Les chiffres ci-dessous suivent le territoire des régions. La Wallonie inclut donc aussi la Communauté germanophone, et Bruxelles compte tous les habitants des dix-neuf communes bruxelloises, même si elles relèvent de deux communautés."
    de: "Die Zahlen unten folgen dem Gebiet der Regionen. Die Wallonie umfasst also auch die Deutschsprachige Gemeinschaft, und Brüssel zählt alle Einwohner der neunzehn Brüsseler Gemeinden, auch wenn diese zu zwei Gemeinschaften gehören."
    en: "The figures below follow the territory of the regions. Wallonia therefore also includes the German-speaking Community, and Brussels counts all residents of the nineteen Brussels municipalities, even though they fall under two communities."
  gw_lees_titel:
    nl: "Hoe lees je de tabel?"
    fr: "Comment lire le tableau ?"
    de: "Wie liest man die Tabelle?"
    en: "How to read the table"
  gw_lees:
    nl: "Per cijfer zie je het recentste jaar waarvoor alle drie de gewesten een cijfer hebben. De balkjes maken het verschil zichtbaar; klik op een vraag voor het verloop door de jaren."
    fr: "Pour chaque chiffre, vous voyez l'année la plus récente pour laquelle les trois régions disposent d'un chiffre. Les barres rendent la différence visible ; cliquez sur une question pour voir l'évolution au fil des ans."
    de: "Für jede Zahl sehen Sie das jüngste Jahr, für das alle drei Regionen eine Zahl haben. Die Balken machen den Unterschied sichtbar; klicken Sie auf eine Frage, um die Entwicklung über die Jahre zu sehen."
    en: "For each figure you see the most recent year for which all three regions have data. The bars make the difference visible; click a question to see how it changed over the years."
  gw_cijfer:
    nl: "Cijfer"
    fr: "Chiffre"
    de: "Zahl"
    en: "Figure"
  gw_voetnoot:
    nl: "Enkel cijfers waarvoor Eurostat een officiële opsplitsing per gewest publiceert. Andere cijfers, zoals de overheidsschuld, bestaan niet op die manier per gewest; die voegen we toe zodra er een officiële bron is."
    fr: "Uniquement les chiffres pour lesquels Eurostat publie une ventilation officielle par région. D'autres chiffres, comme la dette publique, n'existent pas sous cette forme par région ; nous les ajouterons dès qu'une source officielle existera."
    de: "Nur Zahlen, für die Eurostat eine offizielle Aufschlüsselung nach Regionen veröffentlicht. Andere Zahlen, etwa die Staatsschulden, gibt es so nicht pro Region; wir fügen sie hinzu, sobald es eine offizielle Quelle gibt."
    en: "Only figures for which Eurostat publishes an official breakdown by region. Other figures, such as government debt, do not exist in this form per region; we will add them as soon as there is an official source."
  gw_beschrijving:
    nl: "Vlaanderen, Wallonië en Brussel naast elkaar: werk, armoede, gezondheid, onderwijs en meer."
    fr: "Flandre, Wallonie et Bruxelles côte à côte : emploi, pauvreté, santé, enseignement et plus encore."
    de: "Flandern, Wallonie und Brüssel im Vergleich: Arbeit, Armut, Gesundheit, Bildung und mehr."
    en: "Flanders, Wallonia and Brussels side by side: jobs, poverty, health, education and more."

