  rk_intro:
    nl: "Vul je brutoloon in. Je ziet hoeveel er naar de sociale zekerheid en naar belastingen gaat, hoeveel je netto overhoudt, en waar dat geld naartoe gaat. Een benadering voor bedienden, op basis van de officiële tarieven voor inkomstenjaar {jaar}."
