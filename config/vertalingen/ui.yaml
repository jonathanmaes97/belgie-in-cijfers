    de: "Die wichtigsten Zahlen über unser Land, in einfacher Sprache. Direkt aus offiziellen Quellen, jeden Tag automatisch aktualisiert, und bei jeder Zahl steht, woher sie kommt."
    en: "The key figures about our country, in plain language. Straight from official sources, updated automatically every day, and every figure shows where it comes from."
